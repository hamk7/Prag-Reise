großen Monumente."},{"id":"wed_vysehrad_choice","name":"Vyšehrad machen?","icon":"🤔","kind":"decision","transport":"walk","duration":"Entscheidung","action":"Nur wenn ihr noch Lust und Energie habt.","note":"Ja → Krymská / I. P. Pavlova / Metro C. Nein → zurück zum Hotel.","decision":"vysehrad"},{"id":"wed_no_ticket","name":"Zurück zum Hotel","icon":"🔔","kind":"ticket","transport":"transit","duration":"live prüfen","action":"4 × 30-Minuten-Ticket aktivieren, 60 Sekunden warten.","note":"Nur wenn Vyšehrad übersprungen wird.","ticket":"30m","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","condition":{"key":"vysehrad","value":"no"}},{"id":"wed_krymska","name":"Krymská","icon":"🚋","kind":"transit","transport":"walk","duration":"5–8 Min.","action":"Zur Tramhaltestelle Krymská gehen.","note":"Nur bei Vyšehrad-Ja.","query":"Krymská Prague","lat":50.0711,"lon":14.4493,"condition":{"key":"vysehrad","value":"yes"},"guide":"Ab hier beginnt die kurze ÖPNV-Kette zum optionalen Vyšehrad."},{"id":"wed_ticket_vysehrad","name":"4 × 30-Minuten-Ticket","icon":"🔔","kind":"ticket","transport":"transit","duration":"60 Sek. Wartezeit","action":"Tickets aktivieren. Tram 22 Richtung Bílá Hora bis I. P. Pavlova.","note":"Dasselbe Ticket gilt beim Umstieg zur Metro C weiter, solange die 30 Minuten nicht abgelaufen sind.","ticket":"30m","condition":{"key":"vysehrad","value":"yes"}},{"id":"wed_ip","name":"I. P. Pavlova","icon":"🚋","kind":"transit","transport":"transit","duration":"ca. 5–10 Min.","action":"Von Tram 22 zur Metro C umsteigen.","note":"Metro C Richtung Háje.","query":"I. P. Pavlova Prague","lat":50.0752,"lon":14.4305,"condition":{"key":"vysehrad","value":"yes"},"guide":"Hier wechselt ihr von der Tram in die rote Metro-Linie C."},{"id":"wed_metro","name":"Metro C → Vyšehrad","icon":"🚇","kind":"transit","transport":"transit","duration":"1 Station","action":"Metro C Richtung Háje, eine Station bis Vyšehrad.","note":"Zeit des laufenden 30-Minuten-Tickets im Blick behalten.","query":"Vyšehrad metro Prague","lat":50.0638,"lon":14.4302,"condition":{"key":"vysehrad","value":"yes"}},{"id":"wed_vysehrad","name":"Vyšehrad / Tábor-Tor","icon":"🤔","kind":"place","transport":"walk","duration":"5–8 Min. ab Metro","action":"Festungsanlage, Mauern und Aussicht; etwa 30–60 Minuten.","note":"Nicht mit Gewalt machen, wenn ihr müde seid.","query":"Tábor Gate Vyšehrad Prague","lat":50.064,"lon":14.4178,"wiki":"Vyšehrad","guide":"Geschichte: Vyšehrad ist eine historische Festungsanlage auf einem Felsen über der Moldau. Archäologische Spuren reichen ins frühe Mittelalter zurück; im 11. Jahrhundert war der Ort zeitweise ein bedeutendes Herrschaftszentrum der Přemysliden. Später verlor er gegenüber der Prager Burg an politischer Bedeutung. Im Barock wurde Vyšehrad zu einer starken Festung ausgebaut. Zahlreiche tschechische Gründungslegenden verbinden den Ort mit Fürstin Libuše und den Anfängen Prags.\n\nUmgebung: Innerhalb der Mauern findet ihr heute Grünflächen, die Kirche St. Peter und Paul, den berühmten Vyšehrad-Friedhof und mehrere Aussichtspunkte über Moldau und Stadt.\n\nVor Ort beachten: Ihr müsst nicht alles vollständig ablaufen. Für 30–60 Minuten konzentriert euch auf Mauern, Aussicht und Atmosphäre. Der Reiz ist die Mischung aus Legende, Festung und ruhigem Park.","condition":{"key":"vysehrad","value":"yes"}},{"id":"wed_return_ticket","name":"Vyšehrad → Hotel","icon":"🔔","kind":"ticket","transport":"transit","duration":"live prüfen","action":"4 × 30-Minuten-Ticket aktivieren, 60 Sekunden warten und Metro C Richtung Zentrum nehmen.","note":"Nur nach Vyšehrad.","ticket":"30m","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","condition":{"key":"vysehrad","value":"yes"}},{"id":"wed_hotel_end","name":"Hotel – Mittwoch geschafft","icon":"🏨","kind":"hotel","transport":"walk","duration":"Tagesende","action":"Abend frei / Essen.","note":"Morgen auschecken. Vorschlag: 07:30 aufstehen; Checkout spätestens 10:00.","query":"Wenceslas Hotel  ['day','done','skipped','decisions','parking','customParking','planChanges','dayOverrides','dayStartedAt','ticket24At','ticket24Groups','ticket72At','departureAt','klementinumTime','prayerDone','prayerAsrMethod','extraMode'].forEach(function(k){if(p[k]!==undefined)state[k]=p[k];});

async function cloudSaveNow(manual){

 try{
   var payload=syncPayload();
   var res=await cloudRpc('save_trip_state',{p_trip_id:CLOUD_TRIP,p_secret:CLOUD_SECRET,p_state:payload});
   cloudReady=true;
   cloudStatusSet('good','✅ Synchronisiert','Zuletzt gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'.');
   return true;
 }catch(e){
   cloudReady=true;
   cloudStatusSet('warn','☁️ Sync nicht möglich',navigator.onLine===false?'Kein Internet. Lokal ist alles gespeichert.':'Supabase: '+e.message);

async function cloudPull(opts){
 opts=opts||{};
 if(cloudBusy)return false;
 cloudBusy=true;
 if(opts.manual)cloudStatusSet('muted','☁️ Laden …','Neuester Stand wird geprüft.');
 try{
   var data=await cloudRpc('get_trip_state',{p_trip_id:CLOUD_TRIP,p_secret:CLOUD_SECRET});
   var row=Array.isArray(data)?data[0]:data;
   var remote=row&&row.state?row.state:null;
   var serverAt=row&&row.updated_at?row.updated_at:null;
   var remoteValid=meaningfulPayload(remote);
   var local=syncPayload();
   var localValid=meaningfulPayload(local);
   var remoteMs=remoteValid?Date.parse(remote.at||serverAt||0):0;
   var localMs=state._updatedAt?Date.parse(state._updatedAt):0;
   cloudReady=true;
   if(!remoteValid&&localValid){
     cloudBusy=false;
     return cloudSaveNow(false);
   }
   if(remoteValid){
     if(localValid&&localMs>remoteMs+1200){
       cloudBusy=false;
       return cloudSaveNow(false);
     }
     if(remoteMs>localMs+500||!localValid){applyCloudPayload(remote,serverAt);}
   }
   cloudStatusSet('good','✅ Synchronisiert','Cloud geprüft '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'.');
   return true;
 }catch(e){
   cloudReady=true;
   cloudStatusSet('warn','☁️ Sync nicht möglich',navigator.onLine===false?'Kein Internet. Die App arbeitet lokal weiter.':'Supabase: '+e.message);
   return false;
 }finally{cloudBusy=false;}
}

ElementById('row').value;state.parking.spot=document.getElementById('spot').value;state.parking.note=document.getElementById('pnote').value;save();render();}else if(a==='carroute')carroute();else if(a==='jumpmenu'){var d=day(state.day);openModal('<h2>Halt auswählen</h2><div class="list">'+overviewStops(d.id).map(function(s){var cl=conditionLabel(s);return '<button class="btn full" data-action="jump" data-day="'+d.id+'" data-id="'+s.id+'">'+h(s.icon||'📍')+' '+h(s.name)+(cl?' · '+h(cl):'')+'</button>';}).join('')+'</div><div class="hr"></div><button class="btn full" data-action="close">Schließen</button>');}else if(a==='daymenu'){state.tab='days';save();render();}else if(a==='idiommaybe')openModal('<h2>20–30 Minuten Schlange</h2><p>Wenn ihr Idiom unbedingt sehen wollt, jetzt machen. Sonst überspringen.</p><div class="actions"><button class="btn primary" data-dec="idiom" data-val="yes">Machen</button><button class="btn" data-dec="idiom" data-val="no">Überspringen</button></div>');else if(a==='theme'){state.theme=b.dataset.theme;save();render();}else if(a==='prayer')prayerModal(b.dataset.prayer||null);else if(a==='prayerplace')showPrayerPlaces(b.dataset.prayer);else if(a==='prayerdone'){var dd=day(state.day);state.prayerDone[prayerDoneKey(dd.date,b.dataset.prayer)]=new Date().toISOString();save();closeModal();render();alert('✅ '+PRAYER_NAMES[b.dataset.prayer]+' als gebetet gespeichert.');}else if(a==='asrmethod'){state.prayerAsrMethod=state.prayerAsrMethod==='hanafi'?'standard':'hanafi';save();prayerModal();}else if(a==='sharestatesync')shareStateSync();else if(a==='importsync')importSyncModal();else if(a==='applysync'){var se=document.getElementById('synctext');applySyncCode(se&&se.value,true);}else if(a==='cloudpull')cloudPull({manual:true});else if(a==='cloudpush')cloudSaveNow(true);else if(a==='cloudtest')cloudTest();else if(a==='reset'){if(confirm('Wirklich den gesamten Fortschritt löschen?')){localStorage.removeItem(KEY);state=copy(DEFAULTS);state.day=tripDayNow().id;save();render();}}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-dec]');if(!b)return;closeModal();choose(b.dataset.dec,b.dataset.val);});
// Einfacher Selbsttest: wenn dieser Wert gesetzt wird, sind Skript und Event-System aktiv.

try{if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(function(p){locationPermissionState=p.state||'unknown';p.onchange=function(){locationPermissionState=p.state||'unknown';if(state.tab==='settings')render();};if(p.state==='granted')startLocation();else if(state.tab==='settings')render();}).catch(function(){});}}catch(e){}

document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;if(a==='planfromnow'){state.dayStartedAt=state.dayStartedAt||{};state.dayStartedAt[state.day]=new Date().toISOString();save();render();}else if(a==='skip'){skipStop(b.dataset.id);}else if(a==='previewday'){previewDay(b.dataset.day);}else if(a==='continueday'){continueDay(b.dataset.day);}else if(a==='previewstop'){previewStop(b.dataset.day,b.dataset.id);}else if(a==='continuefrom'){closeModal();jump(b.dataset.day,b.dataset.id);}else if(a==='extratime'){state.extraMode=state.extraMode||{};state.extraMode[state.day]=true;save();render();scrollTo(0,0);}else if(a==='returnhotel'){state.extraMode=state.extraMode||{};state.extraMode[state.day]=false;save();render();scrollTo(0,0);}else if(a==='saveticket72'){var el=document.getElementById('ticket72time');state.ticket72At=el&&el.value?new Date(el.value).toISOString():new Date().toISOString();save();render();}else if(a==='clearticket72'){state.ticket72At=null;save();render();}else if(a==='exportsyncfile'){exportSyncFile();}else if(a==='importsyncfile'){importSyncFile();}else if(a==='copyalarm'){var t=b.dataset.time||'';if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('⏰ '+t+' kopiert.');}).catch(function(){alert('Wecker-Vorschlag: '+t);});else alert('Wecker-Vorschlag: '+t);}});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='ticket72toggle'){state.ticket72At=e.target.checked?(state.ticket72At||new Date().toISOString()):null;save();render();}else if(e.target&&e.target.id==='themeRange'){render();}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='themeRange'){var v=parseInt(e.target.value,10);state.theme=v===1?'light':v===2?'dark':'system';save();theme();var labels=document.querySelectorAll('.theme-labels button');labels.forEach(function(x,i){x.classList.toggle('sel',i===v);});}});

theme();render();topDate();
cloudInit();
setInterval(cloudPoll,12000);
