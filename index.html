rer Route.","query":"Dancing House Prague","lat":50.0755,"lon":14.4142,"wiki":"Tanzendes Haus","guide":"Geschichte: Das Tanzende Haus entstand 1994–1996 an einer Baulücke, die seit einem Bombenangriff im Zweiten Weltkrieg bestanden hatte. Der tschechisch-kroatische Architekt Vlado Milunić entwickelte die Idee eines dynamischen Doppelhauses; Frank Gehry arbeitete später am Entwurf mit. Die beiden Gebäudeteile werden oft als tanzendes Paar „Ginger und Fred“ bezeichnet – eine Anspielung auf Ginger Rogers und Fred Astaire.\n\nUmgebung: Das Haus steht an einer prominenten Ecke direkt an der Moldau, wo historische Blockrandbebauung auf sehr expressive Architektur der 1990er-Jahre trifft. Gerade dieser Kontrast macht den Ort interessant.\n\nVor Ort beachten: Achtet auf den gläsernen, eingeschnürten Turm und den massiveren steinernen Nachbarn. Von der gegenüberliegenden Straßenseite wirkt die „Tanzbewegung“ am deutlichsten."},{"id":"sun_slovansky","name":"Slovanský ostrov","icon":"➡️","kind":"place","transport":"walk","duration":"8–10 Min.","action":"Auf die Insel zum Bootsverleih gehen.","note":"Kurz über die Insel laufen, kein eigener langer Besuch.","query":"Slovanský ostrov Prague","lat":50.0792,"lon":14.412,"wiki":"Slovanský ostrov","guide":"Geschichte: Slovanský ostrov, häufig Žofín genannt, ist eine Moldauinsel, die sich durch Ablagerungen des Flusses entwickelte und im 19. Jahrhundert systematisch gestaltet wurde. Sie wurde zu einem beliebten Ort für Erholung, Konzerte und gesellschaftliche Veranstaltungen. Das Žofín-Palais auf der Insel war und ist ein bedeutender Veranstaltungsort der Stadt.\n\nUmgebung: Obwohl ihr nur wenige Minuten von der dichten Neustadt entfernt seid, wirkt die Insel deutlich ruhiger. Von den Uferwegen seht ihr die Moldau, das Nationaltheater und Teile der gegenüberliegenden Kleinseite.\n\nVor Ort beachten: Euer Hauptziel ist der Bootsverleih, aber nehmt euch kurz Zeit für die alten Bäume, die Uferkante und den Blick zurück auf die Stadt. Die Insel zeigt die angenehmere, grünere Seite des Prager Zentrums."},{"id":"sun_slovanka","name":"Tretbootverleih Slovanka","icon":"❤️","kind":"activity","transport":"walk","duration":"3–5 Min.","action":"Tretboot ausleihen.","note":"Geplant: etwa 1 Stunde, möglichst gegen Abend/Sonnenuntergang.","query":"Slovanka boat rental Prague Slovanský ostrov","lat":50.079,"lon":14.4115,"guide":"Hier beginnt die einzige bewusst eingeplante Action-Aktivität eurer Reise."},{"id":"sun_pedal","name":"Tretboot auf der Moldau","icon":"❤️","kind":"activity","transport":"walk","duration":"ca. 1 Stunde","action":"Moldau vom Wasser aus genießen.","note":"Auf Rückgabezeit des Boots achten.","query":"Slovanský ostrov Prague","lat":50.079,"lon":14.4115,"wiki":"Moldau (Fluss)","guide":"Vom Wasser aus seht ihr Prag aus einer ganz anderen Perspektive – mit Ufer, Brücken und Altstadtsilhouette."},{"id":"sun_food","name":"Essen suchen","icon":"🍴","kind":"food","transport":"walk","duration":"flexibel","action":"Restaurants in der aktuellen Umgebung suchen.","note":"Kein Restaurant fest eingeplant. Button „Essen in der Nähe“ nutzen.","query":"restaurants near Slovanský ostrov Prague","guide":"Dieser Platzhalter hält den Abend flexibel. Ihr entscheidet nach Hunger, Uhrzeit und Standort."},{"id":"sun_return","name":"Zurück zum Hotel","icon":"🏨","kind":"transit","transport":"transit","duration":"live prüfen","action":"Wenn sinnvoll ÖPNV statt unnötig weiterzulaufen.","note":"24h-Ticket sollte noch gültig sein. Live-Route ab eurem tatsächlichen Essensort öffnen.","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","lat":50.0795,"lon":14.4286,"guide":"Nach der langen Anfahrt ist ein unkomplizierter Rückweg wichtiger als zusätzliche Kilometer."}]},{"id":"mon","label":"MONTAG","date":"2026-08-31","title":"Petřín + Burg + Kleinseite","duration":"ca. 6–8 Std.","wake":"07:30","leave":"08:15","theme":"Oben starten und überwiegend bergab laufen","stops":[{"id":"mon_cafe","name":"Morgen-Café · IPPA Tylovo náměstí","icon":"☕","kind":"food","transport":"walk","duration":"ca. 5–8 Min. vom Hotel","optional":true,"action":"Wenn ihr jetzt Kaffee oder etwas Kleines essen möchtet: kurz hier stoppen. Danach seid ihr direkt bei I. P. Pavlova für den Weg Richtung Strahov.","note":"Optional. Liegt praktisch am geplanten ÖPNV-Startpunkt I. P. Pavlova. Aktuell montags 08:00–20:00 gelistet.","query":"IPPA Café Tylovo Náměstí, Tylovo Nám. 2, Prague","guide":"Ein kurzer Café-Stopp am Anfang, ohne die Sightseeing-Route später wieder verlassen zu müssen."},{"id":"mon_hotel","name":"I. P. Pavlova → Stadion Strahov","icon":"🏨","kind":"transit","transport":"transit","duration":"ca. 30–45 Min.","action":"Vom Hotel direkt oder nach dem Café zu I. P. Pavlova. Dann live die beste Verbindung Richtung Stadion Strahov prüfen.","note":"Geprüfter Grundplan: Richtung Karlovo náměstí und weiter mit Bus 176 zum Stadion Strahov. Linien vor Abfahrt live prüfen.","query":"Stadion Strahov Prague","lat":50.0806,"lon":14.3872,"guide":"Der Start oben am Strahov-Gelände spart euch einen unnötigen langen Anstieg."},{"id":"mon_strahov","name":"Stadion Strahov / Koleje Strahov","icon":"➡️","kind":"place","transport":"walk","duration":"10–15 Min.","action":"Von hier zum Petřín-Aussichtsturm laufen.","note":"Standseilbahn ist bewusst nicht Teil eures Plans.","query":"Stadion Strahov Prague","lat":50.0806,"lon":14.3872,"wiki":"Strahov-Stadion","guide":"Geschichte: Das Große Strahov-Stadion entstand in mehreren Bauphasen ab den 1920er-Jahren und wurde vor allem für riesige Turn- und Massensportveranstaltungen genutzt. In der sozialistischen Tschechoslowakei fanden hier die Spartakiaden statt, bei denen Zehntausende Menschen gleichzeitig auf dem Innenfeld auftraten. Die Anlage ist weniger wegen klassischer Architektur als wegen ihrer enormen Dimensionen bemerkenswert.\n\nUmgebung: Ihr startet hier oben auf dem Strahov-Hügel. Das ist strategisch wichtig, weil ihr den Rest des Tages überwiegend bergab Richtung Hradčany, Burg und Kleinseite lauft.\n\nVor Ort beachten: Wenn ihr am Stadion vorbeikommt, versucht euch die historische Nutzung mit riesigen synchronen Formationen vorzustellen. Für euch ist es vor allem der Ausgangspunkt zur Petřín-Route."},{"id":"mon_petrin","name":"Petřín-Aussichtsturm","icon":"❤️","kind":"attraction","transport":"walk","duration":"Besuch + Aussicht","action":"Hochgehen und Aussicht genießen.","note":"🎟️ Eintritt erforderlich. Möglichst früh beginnen.","query":"Petřín Tower Prague","lat":50.0835,"lon":14.3951,"wiki":"Petřín-Aussichtsturm","guide":"Geschichte: Der Petřín-Aussichtsturm wurde 1891 für die Prager Jubiläumsausstellung errichtet. Mitglieder des Klubs tschechischer Touristen hatten sich nach einem Besuch in Paris vom Eiffelturm inspirieren lassen. Der Prager Turm ist knapp 59 Meter hoch; durch seine Lage auf dem Petřín-Hügel erreicht seine Aussichtsplattform aber eine beeindruckende Höhe über der Stadt. Die Stahlkonstruktion ist bis heute eines der bekanntesten Prager Wahrzeichen.\n\nUmgebung: Petřín ist eine große grüne Anhöhe westlich der Moldau. Von hier seht ihr die Burg, die Altstadt, die Moldau und bei klarer Sicht weit über Prag hinaus.\n\nVor Ort beachten: Beim Aufstieg verändert sich der Blick ständig. Oben lohnt es sich, eure nächsten Tagespunkte zu suchen: Burg, Hradčany, Kleinseite und die Moldau helfen euch, den restlichen Tag geografisch zu verstehen."},{"id":"mon_strahov_view","name":"Strahov-Aussichtspunkt","icon":"➡️","kind":"place","transport":"walk","duration":"12–15 Min.","action":"Kurz kostenlos Aussicht genießen.","note":"Strahov-Bibliothek innen bleibt ausdrücklich aus dem Plan.","query":"Strahov viewpoint Prague","lat":50.0862,"lon":14.3893,"guide":"Geschichte: Der Aussichtspunkt selbst ist kein einzelnes historisches Bauwerk, sondern Teil der historischen Wege am Strahov-Hügel zwischen Petřín und Hradčany. Das Gebiet entwickelte sich über Jahrhunderte rund um das Strahov-Kloster und die Befestigungen oberhalb der Stadt.\n\nUmgebung: Hier öffnet sich der Blick über Dächer, Türme und die Moldauschleifen. Genau solche erhöhten Punkte erklären, warum Hradčany und die Burg politisch und militärisch so bedeutend waren: Von oben lässt sich das Zentrum hervorragend überblicken.\n\nVor Ort beachten: Nutzt diesen Halt eher als Orientierung als als lange Attraktion. Schaut Richtung Altstadt und versucht Karlsbrücke, Nationaltheater oder Fernsehturm in der Ferne zu erkennen."},{"id":"mon_loreto","name":"Loreto","icon":"➡️","kind":"place","transport":"walk","duration":"8–10 Min.","action":"Nur außen anschauen.","note":"Kein Eintritt und kein zusätzlicher Umweg.","query":"Loreto Prague","lat":50.0899,"lon":14.3919,"wiki":"Prager Loreto","guide":"Geschichte: Das Prager Loreto ist ein barocker Wallfahrtskomplex, dessen Bau im 17. Jahrhundert begann. Im Mittelpunkt steht eine Nachbildung der Santa Casa, des „Heiligen Hauses“ von Loreto in Italien. Besonders bekannt ist das Glockenspiel im Fassadenturm mit zahlreichen Glocken aus dem späten 17. Jahrhundert. Der gesamte Komplex wurde über Jahrzehnte erweitert und reich ausgestattet.\n\nUmgebung: Loretánské náměstí ist ein außergewöhnlich repräsentativer Platz in Hradčany. Direkt gegenüber liegt das monumentale Černín-Palais. Ihr steht hier also zwischen religiöser barocker Repräsentation und weltlicher aristokratischer Macht.\n\nVor Ort beachten: Da ihr nicht hineingeht, konzentriert euch auf die symmetrische Barockfassade, den Turm und den Kontrast zum gewaltigen Palais gegenüber."},{"id":"mon_cernin","name":"Černín-Palais","icon":"➡️","kind":"place","transport":"walk","duration":"1 Min.","action":"Nur außen anschauen.","note":"Steht praktisch gegenüber von Loreto.","query":"Černín Palace Prague","lat":50.0898,"lon":14.3904,"wiki":"Palais Czernin","guide":"Geschichte: Das Černín-Palais wurde ab 1669 für Graf Humprecht Jan Černín nach Plänen von Francesco Caratti gebaut. Seine rund 140 Meter lange Hauptfassade macht es zu einem der monumentalsten Barockpaläste Prags. Später wurde das Gebäude militärisch genutzt und mehrfach stark verändert. Seit der Tschechoslowakei dient es dem Außenministerium. Zur modernen Geschichte gehört auch der bis heute diskutierte Tod des Außenministers Jan Masaryk im Jahr 1948.\n\nUmgebung: Das Palais beherrscht den Loretánské náměstí durch seine enorme Länge. Gegenüber steht das viel kleinteiligere Loreto – ein starker Maßstabsunterschied.\n\nVor Ort beachten: Schaut euch die rhythmische Abfolge der hohen Säulen und Fenster an. Schon die Fassade sollte Reichtum und politischen Rang der Familie Černín demonstrieren."},{"id":"mon_novy_svet","name":"Nový Svět","icon":"➡️","kind":"place","transport":"walk","duration":"4–5 Min.","action":"Durch die schönen Gassen laufen.","note":"Kein langer Aufenthalt.","query":"Nový Svět Prague","lat":50.0906,"lon":14.394,"wiki":"Nový Svět (Prag)","guide":"Geschichte: Nový Svět – „Neue Welt“ – entstand im Umfeld von Hradčany bereits im Mittelalter. Hier lebten häufig Menschen, die für Burg und Hof arbeiteten, später auch ärmere Bewohner. Im Gegensatz zu den großen Adelspalästen in der Nähe blieb der Maßstab der Häuser klein. Viele Gebäude tragen traditionelle Hauszeichen und Namen, oft mit dem Wort „Gold“.\n\nUmgebung: Gerade nach Loreto und Černín-Palais wirkt Nový Svět fast dörflich. Enge Pflastergassen, kleine Häuser und unregelmäßige Grundstücke zeigen eine andere Seite des Burgviertels.\n\nVor Ort beachten: Lauft langsam und schaut auf Türen, Hauszeichen, Fenster und Fassaden statt nur geradeaus. Der Reiz besteht weniger in einer einzelnen Sehenswürdigkeit als in der erhaltenen Atmosphäre des ganzen Straßenzugs."},{"id":"mon_oldhall","name":"Altes Rathaus Hradčany","icon":"➡️","kind":"place","transport":"walk","duration":"6–8 Min.","action":"Fassade im Vorbeigehen ansehen.","note":"Kein Innenbesuch.","query":"Hradčany Old Town Hall Prague","guide":"Geschichte: Hradčany war jahrhundertelang nicht einfach nur „ein Teil von Prag“, sondern eine eigene Stadtgemeinde unmittelbar vor der Burg. Das alte Rathaus erinnert an diese kommunale Selbstständigkeit. Erst 1784 wurden die historischen Prager Städte – Altstadt, Neustadt, Kleinseite und Hradčany – unter einer gemeinsamen Verwaltung zusammengeführt.\n\nUmgebung: Ihr bewegt euch hier durch ein Viertel, das stark von Hof, Adel und Kirche geprägt war, aber trotzdem eigene städtische Institutionen besaß. Zwischen großen Palästen fallen kleinere Verwaltungs- und Bürgerhäuser deshalb besonders auf.\n\nVor Ort beachten: Dieser Punkt ist bewusst kurz. Schaut auf die Fassade und nehmt ihn als historischen Hinweis darauf mit, dass Prag lange aus mehreren getrennten Städten bestand."},{"id":"mon_hradcanske","name":"Hradčanské náměstí","icon":"➡️","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Großen Platz vor der Burg ansehen.","note":"Guter Fotopunkt vor dem Haupteingang.","query":"Hradčanské náměstí Prague","lat":50.0897,"lon":14.3973,"wiki":"Hradschiner Platz","guide":"Geschichte: Hradčanské náměstí ist der große Vorplatz der Prager Burg. Über Jahrhunderte siedelten sich hier bedeutende Adelsfamilien an, weil Nähe zum Herrscher politische Bedeutung hatte. Dadurch entstand ein Ensemble aus Renaissance- und Barockpalästen, Kirchen und repräsentativen Fassaden.\n\nUmgebung: Der Platz ist wie eine Bühne vor dem Burgtor. Auf der einen Seite steht der gewaltige Burgkomplex, auf den anderen Seiten liegen unter anderem Schwarzenberg- und Martinic-Palais. Von der südlichen Platzkante öffnen sich außerdem Blicke über Prag.\n\nVor Ort beachten: Bleibt einmal kurz in der Mitte stehen und dreht euch um 360 Grad. Hier erkennt ihr besonders gut, wie Burg und Adelspaläste gemeinsam ein politisches Zentrum bildeten."},{"id":"mon_martinic","name":"Martinic-Palais","icon":"➡️","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Außenfassade ansehen.","note":"Direkt im Bereich Hradčanské náměstí.","query":"Martinic Palace Prague","lat":50.0894,"lon":14.3977,"wiki":"Martinitz-Palais","guide":"Geschichte: Das Martinic-Palais gehört zu den bedeutenden Renaissancepalästen am Hradschin. Nach dem großen Brand von 1541, der weite Teile von Hradčany und der Kleinseite zerstörte, wurden viele Gebäude repräsentativ neu aufgebaut. Das Palais erhielt im Lauf der Zeit seine charakteristische Renaissancegestalt und umfangreiche Sgraffito-Dekorationen.\n\nUmgebung: Ihr seid hier direkt am Hradčanské náměstí, wo mehrere Adelsfamilien mit auffälligen Stadtpalästen um Prestige konkurrierten. Die Fassaden waren also auch politische Selbstdarstellung.\n\nVor Ort beachten: Schaut besonders auf die grafischen Muster und Figuren der Außenwand. Sgraffito entsteht, indem unterschiedlich gefärbte Putzschichten aufgelegt und anschließend Teile der oberen Schicht weggekratzt werden."},{"id":"mon_schwarzenberg","name":"Schwarzenberg-Palais","icon":"➡️","kind":"place","transport":"walk","duration":"2 Min.","action":"Nur außen anschauen.","note":"Danach direkt zum Burg-Haupteingang.","query":"Schwarzenberg Palace Prague","lat":50.0898,"lon":14.397,"wiki":"Palais Schwarzenberg (Prag)","guide":"Geschichte: Das Schwarzenberg-Palais wurde im 16. Jahrhundert als Renaissancepalais errichtet und ist eines der auffälligsten Gebäude am Hradschiner Platz. Berühmt ist die Fassade mit großflächigem Sgraffito, das aus der Entfernung wie plastisches Mauerwerk wirkt. Heute gehört das Gebäude zur Nationalgalerie Prag.\n\nUmgebung: Direkt vor der Burg ist das Palais ein gutes Beispiel dafür, wie reich der Hochadel in unmittelbarer Nähe des Herrscherhofs baute. Zusammen mit Martinic-Palais und den übrigen Gebäuden entsteht ein beinahe geschlossenes Renaissance- und Barockensemble.\n\nVor Ort beachten: Geht ein paar Meter zurück, damit ihr die gesamte Fassade sehen könnt. Das scheinbare „Steinrelief“ ist größtenteils eine optische Wirkung der Sgraffito-Technik."},{"id":"mon_castle","name":"Prager Burg – Haupteingang","icon":"❤️","kind":"attraction","transport":"walk","duration":"1–2 Min.","action":"🎟️ Jetzt Burg-Ticket prüfen/kaufen.","note":"Historische Gebäude im Sommer gewöhnlich bis 17:00; mit genügend Puffer hineingehen.","query":"Prague Castle main entrance","lat":50.0909,"lon":14.4005,"wiki":"Prager Burg","guide":"Geschichte: Die Prager Burg wurde im späten 9. Jahrhundert zum politischen Zentrum Böhmens. Über mehr als tausend Jahre wurde sie immer wieder erweitert: romanische Kirchen, gotische Kathedrale, Renaissancepaläste und barocke Umbauten liegen hier dicht nebeneinander. Sie war Sitz böhmischer Fürsten und Könige, später der Habsburger Herrscher und heute des tschechischen Präsidenten.\n\nUmgebung: Die „Burg“ ist keine einzelne Festung, sondern ein riesiges Ensemble aus Höfen, Kirchen, Palästen, Gärten und Verwaltungsgebäuden. Deshalb dauert der Weg von einem Punkt zum nächsten innerhalb der Anlage bereits mehrere Minuten.\n\nVor Ort beachten: Versucht nicht, alles gleichzeitig wahrzunehmen. Eure wichtigsten Innenpunkte sind St.-Veits-Dom, Alter Königspalast und Goldenes Gässchen. Achtet unterwegs darauf, wie sich Baustile aus verschiedenen Jahrhunderten direkt berühren."},{"id":"mon_vitus","name":"St.-Veits-Dom","icon":"🎟️","kind":"attraction","transport":"walk","duration":"4–5 Min.","action":"Reingehen.","note":"Teil des Burgbesuchs.","query":"St Vitus Cathedral Prague","lat":50.0909,"lon":14.4006,"wiki":"Veitsdom","guide":"Geschichte: Der St.-Veits-Dom ist die wichtigste Kathedrale Tschechiens. Der gotische Neubau begann 1344, als Prag zum Erzbistum erhoben wurde. Zu den prägenden Baumeistern gehörten Matthias von Arras und Peter Parler. Wegen Kriegen, Geldmangel und politischen Veränderungen blieb der Bau jahrhundertelang unvollendet und wurde erst 1929 endgültig fertiggestellt. Im Dom befinden sich Königsgräber und die Wenzelskapelle mit den böhmischen Kronjuwelen in einem gesicherten Nebenraum.\n\nUmgebung: Der Dom steht mitten im Burgareal und überragt fast alle umliegenden Gebäude. Seine Größe wirkt in den engen Burghöfen besonders monumental.\n\nVor Ort beachten: Schaut auf die Glasfenster, das Netzgewölbe, die Wenzelskapelle und die unterschiedlichen Bauphasen. Außen lohnt sich auch ein Blick auf Wasserspeier und Strebewerk."},{"id":"mon_palace","name":"Alter Königspalast","icon":"🎟️","kind":"attraction","transport":"walk","duration":"2 Min.","action":"Reingehen.","note":"Teil des Burgbesuchs.","query":"Old Royal Palace Prague Castle","lat":50.0905,"lon":14.4014,"wiki":"Alter Königspalast (Prag)","guide":"Geschichte: Der Alte Königspalast war über Jahrhunderte eine zentrale Residenz böhmischer Herrscher. Besonders berühmt ist der Vladislav-Saal aus dem späten 15. Jahrhundert, ein Meisterwerk der Spätgotik mit weitgespanntem Gewölbe. Er wurde für Feste, Versammlungen und sogar Ritterturniere genutzt. Im Palast befand sich außerdem die Böhmische Kanzlei; dort begann 1618 mit dem Prager Fenstersturz ein Ereignis, das eng mit dem Dreißigjährigen Krieg verbunden ist.\n\nUmgebung: Der Palast liegt direkt neben dem Dom und zeigt die weltliche Seite der Burg: Hier wurde regiert, verwaltet und repräsentiert.\n\nVor Ort beachten: Im Vladislav-Saal vor allem nach oben schauen. Die geschwungenen Gewölberippen wirken fast wie ein steinernes Netz und waren für ihre Zeit technisch außergewöhnlich."},{"id":"mon_george","name":"St.-Georgs-Basilika","icon":"➡️","kind":"place","transport":"walk","duration":"2–3 Min.","action":"Nach eurem Plan nur außen anschauen.","note":"Kein zusätzlicher Innenbesuch.","query":"St George Basilica Prague","lat":50.0911,"lon":14.4027,"wiki":"St.-Georgs-Basilika (Prag)","guide":"Geschichte: Die St.-Georgs-Basilika geht auf das frühe 10. Jahrhundert zurück und gehört zu den ältesten Kirchen der Prager Burg. Nach Bränden und Umbauten erhielt sie ihre romanische Grundgestalt; die markante rote Barockfassade kam später hinzu. Neben der Kirche bestand jahrhundertelang ein bedeutendes Benediktinerinnenkloster.\n\nUmgebung: Im Vergleich zum riesigen gotischen St.-Veits-Dom wirkt St. Georg wesentlich kompakter. Gerade dieser Gegensatz zeigt, wie viele unterschiedliche Epochen im Burgareal nebeneinander erhalten sind.\n\nVor Ort beachten: Ihr schaut sie nur außen an. Achtet auf die rote Fassade und versucht euch bewusst zu machen, dass sich dahinter eine wesentlich ältere romanische Kirche verbirgt als die äußere Front vermuten lässt."},{"id":"mon_golden","name":"Goldenes Gässchen","icon":"🎟️","kind":"attraction","transport":"walk","duration":"2–3 Min.","action":"Reingehen.","note":"Teil eures Burgbesuchs.","query":"Golden Lane Prague","lat":50.0922,"lon":14.4035,"wiki":"Goldenes Gässchen","guide":"Geschichte: Das Goldene Gässchen entstand im 16. Jahrhundert an der nördlichen Burgmauer. In die kleinen Räume zwischen den Befestigungsbögen wurden winzige Häuser eingebaut, in denen unter anderem Burgschützen, Handwerker und später andere Bewohner lebten. Der romantische Name führte zu Legenden über Alchemisten, obwohl diese Verbindung historisch stark übertrieben ist. Berühmt ist Haus Nr. 22, in dem Franz Kafka 1916/17 zeitweise arbeitete.\n\nUmgebung: Die niedrigen bunten Häuser stehen im starken Kontrast zu den monumentalen Palästen und Kirchen der Burg. Der Maßstab wirkt fast wie eine eigene kleine Siedlung.\n\nVor Ort beachten: Schaut in die kleinen Innenräume und auf die geringe Wohnfläche. Das macht deutlich, wie anders der Alltag einfacher Burgbewohner gegenüber dem höfischen Leben aussah."},{"id":"mon_exit","name":"Alte Schlossstiege / östlicher Ausgang","icon":"➡️","kind":"place","transport":"walk","duration":"ca. 5 Min.","action":"Burg verlassen und bergab Richtung Malostranská.","note":"Ab hier wird die Route deutlich entspannter bergab.","query":"Old Castle Stairs Prague","lat":50.091,"lon":14.4071,"wiki":"Alte Schlossstiege","guide":"Geschichte: Die Alte Schlossstiege gehört zu den traditionellen Verbindungen zwischen der Burg und der Kleinseite. Solche steilen Wege waren jahrhundertelang wichtige Zugänge zum Hradschin, lange bevor moderne Verkehrsachsen entstanden. Die heutige Treppenanlage ist mehrfach umgestaltet worden, folgt aber der historischen Verbindung zwischen Burgberg und Stadt.\n\nUmgebung: Beim Abstieg verändert sich die Perspektive: Die monumentale Burg liegt plötzlich hinter euch, während sich Dächer, Gärten und die Moldau vor euch öffnen.\n\nVor Ort beachten: Geht vorsichtig auf dem Gefälle und schaut zwischendurch zurück. Der Weg ist selbst weniger „Sehenswürdigkeit“ als ein sehr guter Übergang, bei dem man die Höhenlage der Burg körperlich versteht."},{"id":"mon_wallenstein","name":"Wallenstein-Garten","icon":"❤️","kind":"place","transport":"walk","duration":"12–15 Min.","action":"Kostenlos besuchen.","note":"Dieser Punkt bleibt fest im Plan.","query":"Wallenstein Garden Prague","lat":50.0902,"lon":14.4077,"wiki":"Wallenstein-Garten","guide":"Geschichte: Der Wallenstein-Garten entstand ab den 1620er-Jahren als Teil des riesigen Palais von Albrecht von Wallenstein, einem der mächtigsten Militärführer des Dreißigjährigen Krieges. Für den Bau wurden zahlreiche ältere Häuser und Grundstücke zusammengelegt. Der Garten gehört zu den frühesten großen Barockgärten Prags. Besonders bekannt sind die Sala terrena, die geometrischen Gartenachsen und die künstliche Tropfsteinwand.\n\nUmgebung: Nach dem dichten Burgareal öffnet sich hier plötzlich ein großzügiger, fast höfischer Gartenraum. Heute gehört das Palais zum tschechischen Senat.\n\nVor Ort beachten: Sucht die dunkle Grottenwand, die wie erstarrte Felsen und Fantasiegestalten wirkt. Oft laufen auch Pfauen frei im Garten herum. Die Sala terrena zeigt, wie Innen- und Außenraum barock miteinander verbunden wurden."},{"id":"mon_malostranske","name":"Malostranské náměstí / Kleinseitner Ring","icon":"➡️","kind":"place","transport":"walk","duration":"7–8 Min.","action":"Durch die Kleinseite laufen.","note":"Kein eigener langer Besuch.","query":"Malostranské náměstí Prague","lat":50.0882,"lon":14.4032,"wiki":"Kleinseitner Ring","guide":"Geschichte: Malostranské náměstí ist der zentrale Platz der Kleinseite, die im Mittelalter als eigene Stadt unterhalb der Burg entstand. Nach dem verheerenden Brand von 1541 wurde das Viertel stark erneuert; im 17. und 18. Jahrhundert prägten Adelspaläste und Barockbauten das heutige Erscheinungsbild. Dominant ist die St.-Nikolaus-Kirche mit ihrer Kuppel.\n\nUmgebung: Hier treffen die Wege von Burg, Karlsbrücke und Nerudova zusammen. Der Platz ist deshalb bis heute ein wichtiger Verkehrsknoten, obwohl die Umgebung historisch wirkt.\n\nVor Ort beachten: Ihr müsst keinen langen Halt machen. Schaut auf die Mischung aus Straßenbahn, barocken Fassaden und der großen Kirche – genau diese Überlagerung von Alltag und Geschichte ist typisch für Prag."},{"id":"mon_alley","name":"Engste Gasse / Fußgängerampel-Gasse","icon":"❤️","kind":"place","transport":"walk","duration":"5–7 Min.","action":"Durch die extrem schmale Gasse mit Fußgängerampel laufen.","note":"Gewünschter Programmpunkt. Direkt danach kommt Čertovka als eigener kurzer Halt.","query":"Narrowest street Prague U Lužického semináře","lat":50.0875,"lon":14.407,"guide":"Geschichte: Die sogenannte engste Gasse Prags ist keine bedeutende historische Straße im klassischen Sinn, sondern eine extrem schmale Passage zwischen Häusern an der Kleinseite, die heute vor allem wegen ihrer Fußgängerampel bekannt ist. Weil zwei Personen an manchen Stellen kaum aneinander vorbeikommen, regelt die Ampel den Gegenverkehr.\n\nUmgebung: Die Passage führt hinunter Richtung Čertovka und liegt in einem Bereich mit alten Häusern, kleinen Höfen und engem mittelalterlich wirkendem Stadtgrundriss.\n\nVor Ort beachten: Der Spaß besteht im Durchlaufen. Wartet auf Grün und schaut beim Hinuntergehen nicht nur auf die Ampel, sondern auch darauf, wie eng die Bebauung hier bis an den Wasserlauf heranrückt."},{"id":"mon_certovka","name":"Čertovka","icon":"❤️","kind":"place","transport":"walk","duration":"1–3 Min.","action":"Direkt am Kanal kurz entlangschauen und den Wasser-/Mühlenbereich mitnehmen.","note":"Kein echter Umweg – liegt unmittelbar bei der Engsten Gasse.","query":"Čertovka Prague","lat":50.0874,"lon":14.4068,"wiki":"Čertovka","guide":"Geschichte: Čertovka ist ein schmaler Seitenarm der Moldau, der Kampa vom übrigen Teil der Kleinseite trennt. Der Kanal wurde über Jahrhunderte von Mühlen genutzt; deshalb findet man entlang des Wassers noch historische Mühlräder. Der Name bedeutet ungefähr „Teufelsbach“ und ist mit verschiedenen lokalen Legenden verbunden.\n\nUmgebung: Zusammen mit den alten Häusern, kleinen Brücken und Mühlen entsteht hier eines der romantischsten Bilder der Kleinseite. Der Bereich wird manchmal als „Prager Venedig“ vermarktet, obwohl Čertovka natürlich viel kleiner ist.\n\nVor Ort beachten: Achtet auf die Mühlräder und darauf, wie nah die Gebäude direkt am Wasser stehen. Von kleinen Brücken und Durchblicken ergeben sich oft bessere Fotos als direkt an der engsten Gasse."},{"id":"mon_towers","name":"Kleinseitner Brückentürme","icon":"➡️","kind":"place","transport":"walk","duration":"4–5 Min.","action":"Nur außen anschauen. Nicht hochsteigen.","note":"Danach Kampa-Entscheidung.","query":"Lesser Town Bridge Towers Prague","lat":50.0873,"lon":14.4062,"wiki":"Kleinseitner Brückentürme","guide":"Geschichte: Die Kleinseitner Brückentürme markieren den westlichen Zugang zur Karlsbrücke. Der kleinere Turm hat romanische Ursprünge und hängt noch mit der älteren Judithbrücke zusammen. Der größere gotische Turm entstand im 15. Jahrhundert und orientiert sich gestalterisch am Altstädter Brückenturm. Gemeinsam bildeten sie einen kontrollierten und repräsentativen Stadteingang.\n\nUmgebung: Hier treffen Kleinseite, Karlsbrücke und Mostecká-Straße unmittelbar aufeinander. Früher war dieser Übergang Teil der Krönungsroute der böhmischen Könige.\n\nVor Ort beachten: Ihr steigt nicht hinauf. Schaut stattdessen auf die unterschiedlichen Proportionen der beiden Türme – daran erkennt man, dass sie nicht gleichzeitig entstanden sind."},{"id":"mon_kampa_choice","name":"Kampa machen?","icon":"🤔","kind":"decision","transport":"walk","duration":"Entscheidung","action":"Nur wenn noch Zeit und Lust vorhanden sind.","note":"Kampa ist ausdrücklich optional.","decision":"kampa"},{"id":"mon_kampa","name":"Kampa","icon":"🤔","kind":"place","transport":"walk","duration":"4–5 Min.","action":"Kurz über die Insel laufen.","note":"Optional.","query":"Kampa Prague","lat":50.0857,"lon":14.4084,"wiki":"Kampa (Prag)","guide":"Geschichte: Kampa ist eine Insel bzw. ein durch Čertovka abgetrennter Uferbereich an der Moldau. Seit dem Mittelalter nutzten Mühlen die Wasserströmung, später entstanden Gärten, Wohnhäuser und öffentliche Grünflächen. Im 20. Jahrhundert entwickelte sich der südliche Teil zu einem beliebten Park.\n\nUmgebung: Auf der einen Seite liegt die offene Moldau mit Blick zur Altstadt, auf der anderen die schmale Čertovka mit alten Häusern und Mühlen. Dadurch wechseln innerhalb weniger Meter sehr unterschiedliche Stadträume.\n\nVor Ort beachten: Wenn ihr Kampa macht, bleibt flexibel. Ein kurzer Spaziergang über den Park und entlang des Wassers reicht. Besonders schön sind die Blicke auf Karlsbrücke und die Altstadtsilhouette.","condition":{"key":"kampa","value":"yes"}},{"id":"mon_return_choice","name":"Rückweg zum Hotel","icon":"🤔","kind":"decision","transport":"walk","duration":"Entscheidung","action":"Zu Fuß zurück oder ÖPNV nehmen.","note":"Wenn müde: 4 × 30-Minuten-Ticket aktivieren und Live-Verbindung prüfen.","decision":"monreturn"},{"id":"mon_return_transit","name":"ÖPNV zurück zum Hotel","icon":"🔔","kind":"ticket","transport":"transit","duration":"live prüfen","action":"4 × 30-Minuten-Ticket in PID Lítačka aktivieren, 60 Sekunden warten.","note":"Nur sichtbar, wenn ihr ÖPNV gewählt habt.","ticket":"30m","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","condition":{"key":"monreturn","value":"transit"}},{"id":"mon_hotel_end","name":"Hotel – Montag geschafft","icon":"🏨","kind":"hotel","transport":"walk","duration":"Tagesende","action":"Ausruhen. Morgen möglichst früh zur Karlsbrücke.","note":"Vorschlag morgen: 06:45 aufstehen, ca. 07:30 los. In Einstellungen änderbar.","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","lat":50.0795,"lon":14.4286,"guide":"Der größte Sightseeing-Tag ist geschafft."}]},{"id":"tue","label":"DIENSTAG","date":"2026-09-01","title":"Kleinseite + Josefov + Altstadt + Neustadt","duration":"ca. 11:30–19:20 + Abend frei","wake":"09:45","leave":"11:30","theme":"Lennon-Mauer → Karlsbrücke → Josefov → Altstadt → Pause → Neustadt","stops":[{"id":"tue3_hotel","name":"Hotel – Start","icon":"🏨","kind":"hotel","transport":"walk","duration":"Start","action":"Vom Hotel losgehen. Erst kurz zum PAUL am Wenzelsplatz.","note":"Euer Hotel bleibt Krakovská 1338/10. „Krakovská 20“ aus dem neuen Entwurf war nicht eure gespeicherte Hoteladresse.","query":"Wenceslas Hotel & Apartments Krakovská 1338/10 Prague","guide":"Geschichte & Umgebung: Ihr startet in der Prager Neustadt, nur wenige Minuten südlich des Wenzelsplatzes. Die Neustadt wurde 1348 unter Karl IV. planmäßig angelegt und ist deshalb deutlich großzügiger strukturiert als die mittelalterliche Altstadt.\n\nVor Ort beachten: Heute teilt sich der Tag bewusst in zwei Blöcke. Erst Kleinseite, Karlsbrücke, Josefov und Altstadt; später kommt ihr für Gebet und Pause zurück und macht anschließend die Neustadt-Runde.","planned":"11:30","lat":50.0795,"lon":14.4286,"mapsQuery":"Krakovská 1338/10, 110 00 Praha 1, Czechia"},{"id":"tue3_paul","name":"PAUL – Frühstück / Kaffee","icon":"☕","kind":"food","transport":"walk","duration":"ca. 5 Min. ab Hotel","action":"Kaffee und etwas Kleines essen. Nicht zu lange sitzen; danach direkt Richtung John-Lennon-Mauer.","note":"PAUL Václavské náměstí 42. Dienstag offiziell 07:00–21:00 geöffnet.","query":"PAUL Václavské náměstí 42 Prague","guide":"Warum hier: Das ist kein Sightseeing-Stopp, sondern ein praktischer Startpunkt auf eurem Weg. Die Filiale liegt am Wenzelsplatz nahe dem Hotel.\n\nVor Ort beachten: Kaffee + Croissant/Sandwich reicht. Danach kommt der längste zusammenhängende Fußweg des ersten Blocks zur Kleinseite.","planned":"11:35–12:10","lat":50.0812,"lon":14.4271,"mapsQuery":"PAUL, Václavské náměstí 796/42, 110 00 Praha 1, Czechia"},{"id":"tue3_lennon","name":"John-Lennon-Mauer","icon":"🎨","kind":"place","transport":"walk","duration":"ca. 25 Min. ab PAUL","action":"Mauer anschauen, Fotos machen und die wechselnden Botschaften lesen.","note":"Heute darf dort nicht frei gesprüht werden; Botschaften nur in vorgesehenen Bereichen mit Marker, Kreide oder Bleistift.","query":"John Lennon Wall Prague","guide":"Geschichte: Kurz nach John Lennons Ermordung 1980 entwickelte sich die Mauer spontan zu einer Gedenkstätte. In der kommunistischen Tschechoslowakei wurden dort bald Friedensbotschaften, Liedzeilen und regimekritische Texte hinterlassen. Behörden übermalten die Wand immer wieder, doch neue Botschaften erschienen erneut. Dadurch wurde der Ort zu einem Symbol für freie Meinungsäußerung und Widerstand.\n\nUmgebung: Die Mauer gehört zum Areal des Malteserordens am Velkopřevorské náměstí auf der Kleinseite. Ihr steht hier in einem viel ruhigeren Teil Prags als am Wenzelsplatz.\n\nVor Ort beachten: Die Wand verändert sich laufend. Sucht nicht nach „dem einen originalen Lennon-Bild“ – es liegt längst unter vielen Farbschichten.","planned":"12:35","lat":50.0862,"lon":14.406,"mapsQuery":"John Lennon Wall, Velkopřevorské náměstí, 118 00 Praha 1, Czechia"},{"id":"tue3_charles","name":"Karlsbrücke","icon":"🌉","kind":"place","transport":"walk","duration":"ca. 5–7 Min. bis Brücke, dann überqueren","action":"Von der Kleinseite Richtung Altstadt über die Brücke laufen. Fotos und Aussicht.","note":"Achtet unterwegs auf die Prager Burg hinter euch und den Altstädter Brückenturm vor euch.","query":"Charles Bridge Prague","guide":"Geschichte: Die heutige Steinbrücke entstand im 14. Jahrhundert unter Karl IV., nachdem die ältere Judithbrücke durch Hochwasser schwer beschädigt worden war. Die Karlsbrücke war jahrhundertelang die entscheidende feste Verbindung zwischen Altstadt und Kleinseite. Zwischen 1683 und 1928 kamen die berühmten 30 Heiligenfiguren hinzu; die bekannteste ist Johannes von Nepomuk.\n\nUmgebung: Während ihr nach Osten geht, wechselt ihr von Malá Strana in die Altstadt. Hinter euch steigen Kleinseite, Petřín und Burg auf; vor euch verdichtet sich die mittelalterliche Altstadt.\n\nVor Ort beachten: Nicht nur auf die Statuen schauen. Der Blick längs der Brücke und zurück zur Burg erklärt sehr gut, warum diese Achse so wichtig für Prag ist.","planned":"12:50–13:10","lat":50.0865,"lon":14.4114,"mapsQuery":"Charles Bridge, Karlův most, Prague, Czechia"},{"id":"tue3_bridge_tower","name":"Altstädter Brückenturm","icon":"🏰","kind":"place","transport":"walk","duration":"direkt am Ende der Brücke","action":"Nur von außen anschauen. Heute nicht hochsteigen.","note":"Der Turm markiert den historischen Eintritt von der Karlsbrücke in die Altstadt.","query":"Old Town Bridge Tower Prague","guide":"Geschichte: Der Altstädter Brückenturm entstand in der Mitte des 14. Jahrhunderts im Umfeld der Parler-Bauhütte. Er war nicht nur ein Wehr- und Stadttor, sondern wurde als symbolischer Triumphbogen des böhmischen Königtums gestaltet. Krönungszüge gingen auf ihrem Weg zur Burg durch dieses Tor.\n\nUmgebung: Hinter euch liegt die Karlsbrücke, vor euch führen Karlova und Křižovnická in die Altstadt. Der Turm ist damit eine echte Schwelle zwischen zwei historischen Stadtteilen.\n\nVor Ort beachten: Schaut auf die Skulpturen und Wappen an der Altstadtseite. Das Programm ist bewusst repräsentativ und politisch, nicht nur dekorativ.","planned":"13:10","lat":50.0861,"lon":14.4135,"mapsQuery":"Old Town Bridge Tower, Karlův most, 110 00 Praha 1, Czechia"},{"id":"tue3_klementinum","name":"Klementinum – nur die Höfe","icon":"📚","kind":"place","transport":"walk","duration":"ca. 3–4 Min.","action":"Durch die zugänglichen Höfe gehen. Keine Führung, keine Barockbibliothek, kein Astronomischer Turm.","note":"Der große Komplex ist heute nur ein kurzer Durchgang; die kostenpflichtige Führung lasst ihr bewusst aus.","query":"Clementinum Prague","guide":"Geschichte: Die Jesuiten kamen 1556 nach Prag und entwickelten das Klementinum über Generationen zu einem riesigen Bildungs- und Wissenschaftskomplex. Nach der Aufhebung des Jesuitenordens blieb der Ort eng mit Universität, Bibliothek, Astronomie und Meteorologie verbunden. Heute sitzt hier die Nationalbibliothek.\n\nUmgebung: Das Klementinum ist der große Gebäudeblock zwischen Karlsbrücke und Mariánské náměstí. Seine Höfe wirken fast wie eine kleine Stadt innerhalb der Altstadt.\n\nVor Ort beachten: Auch ohne Führung lohnt der Durchgang. Achtet auf die Architektur der Höfe und auf die Sonnenuhren. Bibliothek und Astronomischer Turm sind nur mit Rundgang zugänglich – heute bewusst nicht.","planned":"13:15–13:25","lat":50.086,"lon":14.4166,"mapsQuery":"Clementinum, Mariánské náměstí 5, 110 00 Praha 1, Czechia"},{"id":"tue3_marianske","name":"Mariánské náměstí / Marienplatz","icon":"🏛️","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Kurz rundherum schauen: Klementinum, Magistrat, Stadtbibliothek und Clam-Gallas-Palais.","note":"Nicht nur direkt zum Idiom laufen – der Platz bündelt mehrere wichtige Institutionen.","query":"Mariánské náměstí Prague","guide":"Geschichte & Umgebung: Mariánské náměstí ist ein kleiner, aber institutionell sehr dichter Platz. Hier treffen Nationalbibliothek/Klementinum, Prager Stadtverwaltung, Stadtbibliothek und bedeutende historische Palais aufeinander.\n\nVor Ort beachten: Dreht euch einmal wirklich um 360 Grad. Gerade weil der Platz nicht monumental groß ist, übersieht man leicht, wie viele wichtige Gebäude direkt nebeneinander stehen.","planned":"13:25","lat":50.087,"lon":14.417,"mapsQuery":"Mariánské náměstí, 110 00 Praha 1, Czechia"},{"id":"tue3_idiom","name":"Idiom-Bücherturm","icon":"📖","kind":"place","transport":"walk","duration":"direkt am Platz","action":"Schlange prüfen. Bis etwa 10–15 Minuten warten; bei deutlich längerer Schlange überspringen.","note":"Der Bücherturm steht im Eingangsbereich der Stadtbibliothek, Mariánské náměstí 98/1.","query":"Municipal Library Prague Idiom","guide":"Geschichte: Die Installation „Idiom“ des slowakischen Künstlers Matej Krén steht seit 1998 in der Stadtbibliothek. Rund 8.000 Bücher bilden einen hohen Zylinder. Spiegel oben und unten erzeugen beim Hineinschauen den Eindruck eines endlosen Tunnels aus Büchern.\n\nUmgebung: Ihr seid weiterhin am Mariánské náměstí. Der Stopp kostet also keinen Umweg – nur die Warteschlange kann Zeit kosten.\n\nVor Ort beachten: Wenn die Schlange heute mehr als etwa 10–15 Minuten beträgt, ist Überspringen sinnvoll. Der Effekt selbst dauert nur kurz.","planned":"13:30","lat":50.0871,"lon":14.4167,"optional":true,"mapsQuery":"Municipal Library of Prague, Mariánské náměstí 98/1, 110 00 Praha 1, Czechia"},{"id":"tue3_maisel","name":"Maisel-Synagoge","icon":"✡️","kind":"place","transport":"walk","duration":"ca. 5 Min.","action":"Außen anschauen; heute kein Pflicht-Innenbesuch.","note":"Ab hier beginnt euer kompakter Josefov-Block.","query":"Maisel Synagogue Prague","guide":"Josefov-Kontext: Die jüdische Gemeinde Prags reicht ungefähr bis ins 10. Jahrhundert zurück. Das historische Ghetto war über Jahrhunderte extrem dicht bebaut. Bei der großen Stadtsanierung um 1900 wurde ein großer Teil abgerissen; deshalb wirken manche Straßen heute viel großzügiger, als man es von einem mittelalterlichen Ghetto erwarten würde.\n\nGeschichte der Synagoge: Die Maisel-Synagoge wurde 1590–1592 für Mordechai Maisel errichtet, Bürgermeister der Judenstadt und einer ihrer wichtigsten Förderer. Der große Brand von 1689 beschädigte das Gebäude schwer; spätere Umbauten veränderten sein Aussehen.\n\nVor Ort beachten: Schaut euch die Lage an der Maiselova an – viele der folgenden jüdischen Orte liegen nur wenige Minuten auseinander.","planned":"13:40","lat":50.0892,"lon":14.4182,"mapsQuery":"Maisel Synagogue, Maiselova 10, 110 00 Praha 1, Czechia"},{"id":"tue3_pinkas","name":"Pinkas-Synagoge","icon":"✡️","kind":"place","transport":"walk","duration":"ca. 3 Min.","action":"Außen anschauen; wenn ihr spontan hineinwollt, gehört sie zum Rundgang des Jüdischen Museums.","note":"Im Inneren befindet sich ein Holocaust-Mahnmal mit den Namen von ungefähr 80.000 jüdischen Opfern aus Böhmen und Mähren.","query":"Pinkas Synagogue Prague","guide":"Geschichte: Die Pinkas-Synagoge geht auf 1535 zurück und ist eine der ältesten erhaltenen Synagogen Prags. Nach dem Zweiten Weltkrieg wurde sie zu einem zentralen Gedenkort: Die Innenwände tragen die Namen von ungefähr 80.000 jüdischen Opfern der Shoah aus Böhmen und Mähren.\n\nUmgebung: Direkt hinter bzw. neben der Synagoge beginnt der Alte Jüdische Friedhof. Dadurch liegen Gebetshaus, Erinnerung an die Shoah und jahrhundertealte Begräbniskultur unmittelbar nebeneinander.\n\nVor Ort beachten: Auch wenn ihr heute nicht hineingeht, ist wichtig zu wissen, dass das Innere kein normales Museum ist, sondern ein sehr stiller Erinnerungsort.","planned":"13:45","lat":50.0891,"lon":14.4167,"mapsQuery":"Pinkas Synagogue, Široká 3, 110 00 Praha 1, Czechia"},{"id":"tue3_cemetery","name":"Alter Jüdischer Friedhof","icon":"🪦","kind":"place","transport":"walk","duration":"direkt neben Pinkas","action":"Von außen bzw. am Zugang anschauen; kein Pflicht-Innenbesuch.","note":"Hier wurde vom 15. Jahrhundert bis 1787 bestattet. Heute gelten die übereinanderliegenden Grabsteine als eines der stärksten Bilder Josefovs.","query":"Old Jewish Cemetery Prague","guide":"Geschichte: Der Alte Jüdische Friedhof wurde im 15. Jahrhundert angelegt und bis 1787 genutzt. Da die jüdische Gemeinde nur begrenzten Raum für Bestattungen hatte, wurden über Jahrhunderte Erdschichten aufgeschüttet und Gräber übereinander angelegt. Mehr als 12.000 Grabsteine sind erhalten.\n\nBedeutende Person: Hier liegt Rabbi Judah Loew ben Bezalel, der Maharal von Prag, der später eng mit der Golem-Legende verbunden wurde.\n\nVor Ort beachten: Selbst wenn ihr nicht hineingeht, erklärt die Mauer einen wichtigen Teil der Geschichte des Viertels: sehr wenig Raum, sehr lange Kontinuität.","planned":"13:50","lat":50.0898,"lon":14.417,"mapsQuery":"Old Jewish Cemetery, Široká 3, 110 00 Praha 1, Czechia"},{"id":"tue3_klausen","name":"Klausen-Synagoge","icon":"✡️","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Außen anschauen. Liegt direkt am Friedhof.","note":"Die Klausen-Synagoge ist die größte erhaltene Synagoge des früheren Prager Ghettos.","query":"Klausen Synagogue Prague","guide":"Geschichte: An dieser Stelle standen im 16. Jahrhundert drei kleinere „Klausen“, darunter eine Talmudschule, die mit Rabbi Löw verbunden war. Nach dem großen Ghetto-Brand von 1689 entstand bis 1694 die heutige frühbarocke Synagoge. Sie war die größte Synagoge des Ghettos.\n\nUmgebung: Friedhof, Zeremonienhalle und Klausen-Synagoge bilden hier ein enges historisches Ensemble.\n\nVor Ort beachten: Vergleicht den barocken Charakter mit der viel älteren gotischen Altneu-Synagoge, die gleich danach kommt.","planned":"13:55","lat":50.09,"lon":14.4173,"mapsQuery":"Klausen Synagogue, U Starého hřbitova 3a, 110 00 Praha 1, Czechia"},{"id":"tue3_jewish_townhall","name":"Jüdisches Rathaus – hebräische Uhr","icon":"🕰️","kind":"place","transport":"walk","duration":"ca. 2 Min.","action":"Nach oben zur hebräischen Uhr schauen.","note":"Die Zeiger drehen sich entgegen einer normalen Uhr; der kleine Zeiger zeigt Minuten, der große Stunden.","query":"Jewish Town Hall Prague","guide":"Geschichte: Das Jüdische Rathaus entstand im 16. Jahrhundert und wurde nach späteren Bränden und Umbauten verändert. Es dient bis heute der Prager jüdischen Gemeinde.\n\nBesonderheit: Die hebräische Uhr gilt als älteste bekannte jüdische Uhr im öffentlichen Raum. Die Zeiger laufen entgegen der üblichen Richtung – passend zur Leserichtung des Hebräischen. Zusätzlich sind kleiner und großer Zeiger in ihrer Funktion vertauscht.\n\nVor Ort beachten: Die Uhr ist leicht zu übersehen, wenn man nur auf Augenhöhe weiterläuft. Deshalb bewusst hochschauen.","planned":"14:00","lat":50.0902,"lon":14.4181,"mapsQuery":"Jewish Town Hall, Maiselova 18, 110 00 Praha 1, Czechia"},{"id":"tue3_oldnew","name":"Altneu-Synagoge","icon":"✡️","kind":"place","transport":"walk","duration":"direkt gegenüber","action":"Außen anschauen; einer der wichtigsten historischen Punkte Josefovs.","note":"Sie stammt aus dem 13. Jahrhundert und wird bis heute als Synagoge genutzt.","query":"Old-New Synagogue Prague","guide":"Geschichte: Die Altneu-Synagoge stammt aus dem 13. Jahrhundert und gehört zu den ältesten noch genutzten Synagogen Europas. Ihre gotische Architektur unterscheidet sich stark von späteren Prager Synagogen.\n\nLegende: In der Prager Überlieferung soll Rabbi Löw den Golem nach dessen Stilllegung auf dem Dachboden der Synagoge verborgen haben. Das ist Legende, aber sie hat die Wahrnehmung des Ortes weltweit geprägt.\n\nVor Ort beachten: Vergleicht die niedrige, mittelalterliche Erscheinung mit der späteren Spanischen Synagoge – beide erzählen völlig verschiedene Epochen jüdischen Lebens in Prag.","planned":"14:05","lat":50.0903,"lon":14.4181,"mapsQuery":"Old-New Synagogue, Červená, 110 01 Praha 1, Czechia"},{"id":"tue3_spanish","name":"Spanische Synagoge","icon":"✡️","kind":"place","transport":"walk","duration":"ca. 4 Min.","action":"Außen anschauen. Die maurisch inspirierte Fassade ist schon von außen auffällig.","note":"Das heutige Gebäude entstand 1867–1868 an der Stelle der älteren „Alten Schule“.","query":"Spanish Synagogue Prague","guide":"Geschichte: Die Spanische Synagoge wurde 1867–1868 im maurischen Revival-Stil errichtet. Ihr Name bezieht sich auf die historisierende, von islamischer Architektur Spaniens inspirierte Formensprache – nicht darauf, dass sie von einer spanischen Gemeinde gebaut worden wäre.\n\nUmgebung: Sie steht am nördlichen Rand des historischen Josefov. Hier sieht man besonders gut den Übergang von mittelalterlicher jüdischer Geschichte zur repräsentativen Stadtarchitektur des 19. Jahrhunderts.\n\nVor Ort beachten: Vergleicht ihre dekorative Fassade direkt mit der strengen Gotik der Altneu-Synagoge.","planned":"14:10","lat":50.0905,"lon":14.42,"mapsQuery":"Spanish Synagogue, Vězeňská 1, 110 00 Praha 1, Czechia"},{"id":"tue3_parizska","name":"Pařížská-Straße","icon":"✨","kind":"place","transport":"walk","duration":"ca. 3–5 Min.","action":"Richtung Altstädter Ring laufen und dabei vor allem nach oben auf die Fassaden schauen.","note":"Die breite Straße ist kein mittelalterliches Relikt, sondern entstand bei der Sanierung des ehemaligen Ghettos um 1900.","query":"Pařížská Prague","guide":"Geschichte: Pařížská entstand im Zuge der großen Assanierung Josefovs um die Wende zum 20. Jahrhundert. Viele ältere, enge Gassen und Häuser wurden abgebrochen; an ihre Stelle kamen breite Straßen und repräsentative Mietshäuser.\n\nUmgebung: Heute ist Pařížská als Luxusstraße bekannt. Historisch ist sie aber vor allem ein sichtbares Ergebnis der radikalen Umgestaltung des ehemaligen Ghettos.\n\nVor Ort beachten: Nicht nur Schaufenster ansehen. Die eigentliche Sehenswürdigkeit sind die historistischen und Jugendstil-Fassaden über den Geschäften.","planned":"14:20","lat":50.0895,"lon":14.4199,"mapsQuery":"Pařížská, 110 00 Praha 1, Czechia"},{"id":"tue3_oldtown_square","name":"Altstädter Ring","icon":"🏛️","kind":"place","transport":"walk","duration":"ca. 7–10 Min. über Pařížská","action":"Nicht direkt zur Uhr rennen: erst den Platz als Ganzes anschauen.","note":"Im Pflaster vor dem Rathaus erinnern 27 Kreuze an die 1621 hingerichteten böhmischen Aufständischen.","query":"Old Town Square Prague","guide":"Geschichte: Der Altstädter Ring entwickelte sich bereits seit dem 10. Jahrhundert an der Kreuzung internationaler Handelswege. Im Mittelalter wurde er zum wirtschaftlichen und politischen Zentrum der Altstadt. Hier fanden Märkte, Krönungsfeiern, politische Kundgebungen und auch Hinrichtungen statt.\n\n1621: Nach der Niederlage des böhmischen Ständeaufstands wurden hier 27 Teilnehmer hingerichtet. Die Kreuze im Pflaster vor dem Rathaus erinnern daran.\n\nUmgebung: Auf wenigen Metern stehen Rathaus mit Orloj, Teynkirche, St. Nikolaus, Kinský-Palais, Haus zur Steinernen Glocke und Jan-Hus-Denkmal. Deshalb ist der Platz selbst die Sehenswürdigkeit – nicht nur die Uhr.","planned":"14:35","lat":50.0875,"lon":14.4213,"mapsQuery":"Old Town Square, Staroměstské náměstí, Prague, Czechia"},{"id":"tue3_clock","name":"Prager Astronomische Uhr / Orloj","icon":"🕰️","kind":"place","transport":"walk","duration":"0–2 Min.","action":"Astronomisches Zifferblatt ansehen. Wenn ihr kurz vor einer vollen Stunde da seid, auf den Apostellauf warten.","note":"Das astronomische Uhrwerk stammt aus dem frühen 15. Jahrhundert.","query":"Prague Astronomical Clock","guide":"Geschichte: Der Orloj wurde 1410 eingerichtet und gehört zu den ältesten astronomischen Uhren der Welt, die bis heute in Betrieb sind. Das Zifferblatt verbindet Zeitmessung mit astronomischen Informationen und historischen Zeitsystemen. Später kamen Kalender und Figurenmechanik hinzu.\n\nUmgebung: Die Uhr sitzt an der Südseite des Altstädter Rathauses und wirkt fast klein im Vergleich zur Bedeutung, die sie für Prag hat.\n\nVor Ort beachten: Neben den Aposteln auf das astronomische Zifferblatt schauen. Gerade die verschiedenen Ringe und Anzeigen machen die Uhr außergewöhnlich.","planned":"14:40","lat":50.087,"lon":14.4208,"mapsQuery":"Prague Astronomical Clock, Staroměstské náměstí 1, 110 00 Praha 1, Czechia"},{"id":"tue3_stnicholas","name":"St.-Nikolaus-Kirche am Altstädter Ring","icon":"⛪","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Außen anschauen. Nicht mit St. Nikolaus auf der Kleinseite verwechseln.","note":"Diese Kirche ist der barocke Bau am Altstädter Ring.","query":"St Nicholas Church Old Town Square Prague","guide":"Geschichte: Die heutige St.-Nikolaus-Kirche am Altstädter Ring wurde 1732–1737 nach Plänen von Kilian Ignaz Dientzenhofer errichtet. Sie ist ein wichtiger Prager Barockbau.\n\nUmgebung: Ihre helle, geschwungene Barockfassade setzt einen starken Kontrast zu den gotischen und historistischen Gebäuden am Platz.\n\nVor Ort beachten: Achtet darauf, dass Prag zwei sehr bekannte Nikolauskirchen hat. Diese hier steht in der Altstadt; die große Kuppelkirche auf der Kleinseite ist ein anderer Bau.","planned":"14:45","lat":50.0881,"lon":14.4194,"mapsQuery":"St. Nicholas Church, Old Town Square, Staroměstské náměstí, Prague, Czechia"},{"id":"tue3_hus","name":"Jan-Hus-Denkmal","icon":"🗿","kind":"place","transport":"walk","duration":"1 Min.","action":"Kurz um das Denkmal herumgehen und die Figuren ansehen.","note":"Das Monument wurde 1915 zum 500. Todestag von Jan Hus enthüllt.","query":"Jan Hus Monument Prague","guide":"Geschichte: Jan Hus war ein böhmischer Kirchenreformer und Prediger, der 1415 beim Konzil von Konstanz als Ketzer verbrannt wurde. Seine Ideen wirkten stark auf die spätere hussitische Bewegung und auf die tschechische nationale Erinnerung.\n\nDas Denkmal: Ladislav Šalouns monumentale Skulptur wurde 1915 aufgestellt. Hus steht im Zentrum; weitere Figurengruppen verweisen auf Hussiten und auf Exil und Unterdrückung nach der Schlacht am Weißen Berg.\n\nVor Ort beachten: Schaut, wohin Hus blickt: zur Teynkirche, die zeitweise ein wichtiges Zentrum der hussitischen Bewegung war.","planned":"14:48","lat":50.0878,"lon":14.4216,"mapsQuery":"Jan Hus Monument, Staroměstské náměstí, 110 00 Praha 1, Czechia"},{"id":"tue3_storch","name":"Štorch-Haus","icon":"🏠","kind":"place","transport":"walk","duration":"1 Min.","action":"Fassade anschauen und nach oben sehen.","note":"Das bemalte Haus ist einer der auffälligsten Fassadenpunkte am Altstädter Ring.","query":"Štorch House Prague","guide":"Geschichte & Architektur: Das Štorch-Haus ist ein historistisches Bürgerhaus mit einer stark dekorierten Fassade. Seine heutige Wirkung verbindet Neorenaissance mit Motiven, die an die tschechische nationale Wiedergeburt erinnern.\n\nUmgebung: Am Altstädter Ring konkurrieren viele Fassaden miteinander. Das Štorch-Haus ist ein gutes Beispiel dafür, warum man hier nicht nur auf Erdgeschosshöhe schauen sollte.\n\nVor Ort beachten: Sucht die figürlichen Malereien und die reich gegliederte obere Fassade.","planned":"14:52","lat":50.0876,"lon":14.4219,"mapsQuery":"Štorch House, Staroměstské náměstí 16, Prague, Czechia"},{"id":"tue3_stonebell","name":"Haus zur Steinernen Glocke","icon":"🏰","kind":"place","transport":"walk","duration":"1 Min.","action":"Gotische Fassade ansehen und die kleine steinerne Glocke an der Ecke suchen.","note":"Die heute sichtbare gotische Erscheinung war lange unter späteren Umbauten verborgen.","query":"House at the Stone Bell Prague","guide":"Geschichte: Das Haus zur Steinernen Glocke gehört zu den bemerkenswertesten gotischen Stadtpalästen Prags und geht im Kern auf das 13./14. Jahrhundert zurück. Im Laufe der Jahrhunderte wurde die gotische Gestalt durch spätere Umbauten verdeckt. Bei Restaurierungen des 20. Jahrhunderts legte man sie wieder frei.\n\nMögliche königliche Verbindung: Wegen seiner ungewöhnlich repräsentativen Form wird eine Verbindung zum luxemburgischen Königshof diskutiert.\n\nVor Ort beachten: Sucht an der Ecke die steinerne Glocke, die dem Gebäude seinen Namen gab.","planned":"14:55","lat":50.0878,"lon":14.4223,"mapsQuery":"House at the Stone Bell, Staroměstské náměstí 13, 110 00 Praha 1, Czechia"},{"id":"tue3_kinsky","name":"Kinský-Palais","icon":"🏛️","kind":"place","transport":"walk","duration":"1 Min.","action":"Rokoko-Fassade von außen anschauen.","note":"Heute Teil der Nationalgalerie; der Palast hat auch Bezüge zur Familie Kafka und zur tschechischen Geschichte.","query":"Kinsky Palace Prague","guide":"Geschichte: Das Rokoko-Palais entstand Mitte des 18. Jahrhunderts. Später gehörte es der Familie Kinský. Im 19. und 20. Jahrhundert war es Schauplatz unterschiedlicher politischer und kultureller Geschichten; Franz Kafka besuchte in diesem Gebäude zeitweise das deutsche Gymnasium, und sein Vater betrieb im Erdgeschoss ein Geschäft.\n\nUmgebung: Die helle Rokoko-Fassade steht direkt neben gotischen und barocken Nachbarn – ein guter Überblick über die vielen Epochen des Altstädter Rings.\n\nVor Ort beachten: Achtet auf die feine Stuck- und Skulpturendekoration der Fassade.","planned":"14:58","lat":50.0879,"lon":14.4219,"mapsQuery":"Kinský Palace, Staroměstské náměstí 12, 110 00 Praha 1, Czechia"},{"id":"tue3_tyn","name":"Teynkirche / Kirche Unserer Lieben Frau vor dem Teyn","icon":"⛪","kind":"place","transport":"walk","duration":"2–3 Min.","action":"Wenn ohne Messe möglich, kurz hineingehen; sonst außen anschauen.","note":"Dienstags im September regulär 15:00–17:00 für Besichtigungen geöffnet. Eintritt frei, Spende empfohlen.","query":"Church of Our Lady before Tyn Prague","guide":"Geschichte: Die heutige hochgotische Kirche entstand ab der Mitte des 14. Jahrhunderts und wurde zu einer der wichtigsten Kirchen der Prager Altstadt. Während der Hussitenzeit war sie eng mit der reformatorischen Bewegung verbunden. Nach 1620 wurde sie wieder katholisch geprägt.\n\nInnen: Hier liegt der Astronom Tycho Brahe begraben. Die Orgel von 1673 gilt als die älteste erhaltene Orgel Prags.\n\nUmgebung: Die Türme wirken vom Altstädter Ring sehr dominant, doch der eigentliche Eingang ist zwischen den vorgelagerten Häusern etwas versteckt.\n\nVor Ort beachten: Wenn ihr zwischen 15 und 17 Uhr dort seid und keine Messe stattfindet, lohnt ein kurzer Blick hinein.","planned":"15:05–15:15","lat":50.0877,"lon":14.4228,"mapsQuery":"Church of Our Lady before Týn, Staroměstské náměstí 14, 110 00 Praha 1, Czechia"},{"id":"tue3_ungelt","name":"Ungelt / Teynhof","icon":"🏘️","kind":"place","transport":"walk","duration":"1–2 Min. hinter der Teynkirche","action":"Durch den historischen Handelshof gehen.","note":"Achtet auf das Renaissance-Granovský-Palais und die ruhigere Hofatmosphäre.","query":"Tyn Court Ungelt Prague","guide":"Geschichte: Der Ungelt war ein befestigter Handelshof, dessen Geschichte bis mindestens ins 11. Jahrhundert zurückreicht. Auswärtige Händler konnten hier Waren lagern, übernachten und mussten Abgaben bzw. Zoll entrichten.\n\nUmgebung: Der Hof liegt direkt hinter der Teynkirche und ist trotzdem leicht zu übersehen. Er zeigt, wie eng Religion, Fernhandel und Stadtentwicklung in der mittelalterlichen Altstadt verbunden waren.\n\nVor Ort beachten: Schaut auf die Renaissance-Sgraffiti am Granovský-Palais.","planned":"15:15","lat":50.0883,"lon":14.4234,"mapsQuery":"Týn Court - Ungelt, Týn, 110 00 Praha 1, Czechia"},{"id":"tue3_celetna","name":"Celetná-Straße","icon":"🚶","kind":"place","transport":"walk","duration":"ca. 5 Min. gemütlich","action":"Richtung Pulverturm laufen.","note":"Ihr folgt hier einem Abschnitt des historischen Königswegs.","query":"Celetná Prague","guide":"Geschichte & Umgebung: Celetná ist eine der wichtigsten historischen Straßen der Altstadt. Sie verbindet den Altstädter Ring mit dem Bereich des Pulverturms und gehörte zum traditionellen Krönungsweg der böhmischen Könige.\n\nVor Ort beachten: Nicht jeden einzelnen Laden anschauen müssen – die Straße selbst ist die Verbindung. Achtet auf Hauszeichen und die wechselnden Fassaden.","planned":"15:25","lat":50.0877,"lon":14.425,"mapsQuery":"Celetná, 110 00 Praha 1, Czechia"},{"id":"tue3_blackmadonna","name":"Haus zur Schwarzen Muttergottes","icon":"◼️","kind":"place","transport":"walk","duration":"ca. 3–4 Min.","action":"Außen ansehen und an der Ecke die kleine Schwarze Madonna suchen.","note":"Das Gebäude von Josef Gočár gilt als Schlüsselwerk des tschechischen Kubismus.","query":"House of the Black Madonna Prague","guide":"Geschichte: Josef Gočár entwarf das Gebäude 1911–1912 für den Kaufmann František Josef Herbst. Es ist eines der berühmtesten Beispiele dafür, dass der Kubismus in Böhmen nicht nur Malerei, sondern sogar Architektur, Möbel und Alltagsdesign beeinflusste.\n\nName: An der Hausecke befindet sich die Figur der Schwarzen Madonna, die aus dem Vorgängerbau übernommen wurde und dem modernen Gebäude seinen historischen Namen gab.\n\nVor Ort beachten: Achtet darauf, wie die kantigen kubistischen Formen trotz der Modernität auf die Proportionen der historischen Altstadt reagieren.","planned":"15:32","lat":50.0873,"lon":14.4259,"mapsQuery":"House of the Black Madonna, Ovocný trh 19, 110 00 Praha 1, Czechia"},{"id":"tue3_powder","name":"Pulverturm","icon":"🏰","kind":"place","transport":"walk","duration":"ca. 3–4 Min.","action":"Nur außen anschauen.","note":"Der Turm war ein repräsentatives Stadttor und später Pulverlager.","query":"Powder Tower Prague","guide":"Geschichte: Der Pulverturm wurde ab 1475 als repräsentatives Tor der Altstadt errichtet. Hier begann später der zeremonielle Königsweg, der über Altstadt, Karlsbrücke und Kleinseite zur Prager Burg führte. Erst die spätere Nutzung als Schießpulverlager gab ihm seinen heutigen Namen.\n\nUmgebung: Direkt neben dem mittelalterlich wirkenden schwarzen Turm steht das viel jüngere Jugendstil-Gemeindehaus.\n\nVor Ort beachten: Genau dieser Stilkontrast ist einer der spannendsten Punkte hier.","planned":"15:40","lat":50.0871,"lon":14.4278,"mapsQuery":"Powder Tower, náměstí Republiky 5, 110 00 Praha 1, Czechia"},{"id":"tue3_municipal","name":"Gemeindehaus / Obecní dům","icon":"✨","kind":"place","transport":"walk","duration":"direkt daneben","action":"Außen anschauen; Jugendstilfassade und Kuppel beachten.","note":"Das Gebäude entstand 1905–1911 an der Stelle des früheren Königshofs.","query":"Municipal House Prague","guide":"Geschichte: Das Gemeindehaus wurde 1905–1911 als repräsentatives Kultur- und Gesellschaftshaus im Jugendstil errichtet. Zahlreiche bedeutende Künstler arbeiteten an Ausstattung und Dekoration, darunter Alfons Mucha. Historisch stand hier zuvor der Königshof, in dem böhmische Herrscher vor dem dauerhaften Umzug auf die Burg residierten.\n\nUmgebung: Der direkte Nachbar Pulverturm ist fast 450 Jahre älter. Die beiden Gebäude nebeneinander machen Prags Zeitschichten extrem sichtbar.\n\nVor Ort beachten: Schaut besonders auf Mosaik, Skulpturen und die reich dekorierte Hauptfassade.","planned":"15:44","lat":50.0873,"lon":14.4283,"mapsQuery":"Municipal House, náměstí Republiky 5, 111 21 Prague, Czechia"},{"id":"tue3_naprikope","name":"Na Příkopě","icon":"🛍️","kind":"place","transport":"walk","duration":"ca. 5–10 Min. Richtung Wenzelsplatz","action":"Über Na Příkopě Richtung Wenzelsplatz laufen. Keine zusätzliche Sehenswürdigkeit erzwingen.","note":"Das ist jetzt bewusst eine Verbindungsstrecke zurück Richtung Hotel.","query":"Na Příkopě Prague","guide":"Geschichte & Umgebung: Na Příkopě bedeutet sinngemäß „am Graben“. Die Straße folgt dem Bereich des ehemaligen Stadtgrabens zwischen Altstadt und Neustadt. Heute ist sie eine der wichtigsten Einkaufs- und Geschäftsachsen Prags.\n\nVor Ort beachten: Jetzt Tempo machen. Dieser Abschnitt dient bewusst als Rückweg und nicht als weiterer Museumsblock.","planned":"15:50","lat":50.0852,"lon":14.4269,"mapsQuery":"Na Příkopě, 110 00 Praha 1, Czechia"},{"id":"tue3_hotel_prayer","name":"Hotel – Pause + Öğle","icon":"🕌","kind":"hotel","transport":"walk","duration":"ca. 15–20 Min. ab Na Příkopě","action":"Zurück ins Hotel: Wasser, Toilette, kurz ausruhen und Öğle beten.","note":"İkindi nur beten, wenn eure eigene eingestellte Zeit bereits begonnen hat. Bei Hanafi liegt sie heute deutlich später als 16:15.","query":"Wenceslas Hotel Apartments Prague","guide":"Warum die Pause sinnvoll ist: Ihr habt bis hierhin bereits Kleinseite, Karlsbrücke, Josefov und große Teile der Altstadt zu Fuß gemacht. Der Hotelstopp teilt den Tag bewusst in zwei überschaubare Blöcke.\n\nGebet: Öğle ist zu diesem Zeitpunkt bereits fällig. Für İkindi richtet ihr euch nach eurer eigenen Gebetszeit bzw. der in der App gewählten Berechnung. Nicht vorziehen, nur damit beide Gebete in die Pause passen.","planned":"16:15–17:00","lat":50.0795,"lon":14.4286,"mapsQuery":"Krakovská 1338/10, 110 00 Praha 1, Czechia"},{"id":"tue3_stateopera","name":"Staatsoper Prag","icon":"🎭","kind":"place","transport":"walk","duration":"ca. 5–8 Min. ab Hotel","action":"Von außen anschauen.","note":"Heute Abend ist dort Programm; ihr macht nur den Außenstopp.","query":"State Opera Prague","guide":"Geschichte: Das Gebäude wurde 1888 als Neues Deutsches Theater eröffnet; die Eröffnungsvorstellung war Wagners „Die Meistersinger von Nürnberg“. Der Bau ist neorenaissancezeitlich gestaltet, während der Zuschauerraum besonders reich im Neo-Rokoko dekoriert wurde. Heute gehört die Staatsoper organisatorisch zum Nationaltheater.\n\nUmgebung: Ihr steht direkt am oberen Ende des Zentrums, nahe Nationalmuseum und Hauptbahnhof.\n\nVor Ort beachten: Schaut auf die repräsentative Fassade und merkt euch den Unterschied zum eigentlichen Nationaltheater an der Moldau.","planned":"17:05","lat":50.0807,"lon":14.4328,"mapsQuery":"State Opera, Wilsonova 4, 110 00 Praha 1, Czechia"},{"id":"tue3_jerusalem","name":"Jerusalemsynagoge","icon":"✡️","kind":"place","transport":"walk","duration":"ca. 7–8 Min.","action":"Fassade anschauen. Für einen Innenbesuch seid ihr voraussichtlich zu spät.","note":"Die Synagoge ist dienstags regulär bis 17:00 geöffnet.","query":"Jerusalem Synagogue Prague","guide":"Geschichte: Die Jerusalemsynagoge, auch Jubiläumssynagoge genannt, wurde 1905–1906 nach Plänen des Wiener Architekten Wilhelm Stiassny errichtet. Sie verbindet maurische Formen mit Jugendstil und ist die jüngste sowie größte Synagoge der Prager jüdischen Gemeinde.\n\nUmgebung: Anders als die mittelalterlichen Synagogen in Josefov liegt sie in der Neustadt. Das zeigt, wie sich jüdisches Leben nach Auflösung und Umbau des Ghettos räumlich veränderte.\n\nVor Ort beachten: Die farbige Fassade mit großem Bogen, Rosette und Ornamenten ist schon von außen das Highlight.","planned":"17:15","lat":50.0844,"lon":14.4335,"mapsQuery":"Jerusalem Synagogue, Jeruzalémská 7, 110 00 Praha 1, Czechia"},{"id":"tue3_jindrisska","name":"Jindřišská věž / Heinrichsturm","icon":"🗼","kind":"place","transport":"walk","duration":"ca. 4 Min.","action":"Reingehen und hoch zur Aussicht.","note":"Heute bis 19:00 geöffnet. Regulärer Erwachsenenpreis aktuell 190 CZK.","query":"Jindrisska Tower Prague","guide":"Geschichte: Die Jindřišská věž ist ein spätgotischer freistehender Glockenturm. Ihr heutiges Erscheinungsbild wurde durch spätere Schäden und neugotische Restaurierungen geprägt. Mit rund 65,7 Metern ist sie der höchste freistehende Glockenturm Prags.\n\nBesonderheit: Im Turm befindet sich ein Glockenspiel aus zehn Bronzeglocken. Heute sind mehrere Etagen öffentlich zugänglich, oben gibt es Aussicht.\n\nWarum heute: Da ihr Klementinum-Turm und andere Aussichtspunkte heute auslasst, ist dies euer gezielter Aussichtsstopp am Nachmittag.","planned":"17:25–18:00","lat":50.0847,"lon":14.4305,"mapsQuery":"Jindřišská Tower, Jindřišská 33, 110 00 Praha 1, Czechia"},{"id":"tue3_wenceslas","name":"Wenzelsplatz","icon":"🏛️","kind":"place","transport":"walk","duration":"ca. 5 Min.","action":"Vom Bereich Jindřišská auf den Wenzelsplatz gehen und den Boulevard bewusst wahrnehmen.","note":"Der Platz ist eigentlich ein 750 Meter langer Boulevard und ein zentraler politischer Erinnerungsort.","query":"Wenceslas Square Prague","guide":"Geschichte: Der Wenzelsplatz entstand 1348 bei der Gründung der Prager Neustadt durch Karl IV. Ursprünglich diente er als Pferdemarkt. Im 19. und 20. Jahrhundert wurde er zu einem Zentrum von Handel, öffentlichem Leben und politischer Mobilisierung.\n\nModerne Geschichte: Hier spielten sich entscheidende Ereignisse rund um Staatsgründung 1918, Proteste gegen Besatzung und die Samtene Revolution 1989 ab.\n\nVor Ort beachten: Denkt den Platz nicht als kleines Quadrat, sondern als lange städtische Achse zwischen Altstadt und Nationalmuseum.","planned":"18:05","lat":50.081,"lon":14.4253,"mapsQuery":"Wenceslas Square, Václavské náměstí, Prague, Czechia"},{"id":"tue3_wenceslas_monument","name":"Wenzelsdenkmal + Nationalmuseum von außen","icon":"🐎","kind":"place","transport":"walk","duration":"ca. 7–10 Min. den Platz hinauf","action":"Wenzelsdenkmal ansehen und die Fassade des Nationalmuseums dahinter betrachten.","note":"Nur außen; danach wieder Richtung Lucerna.","query":"St Wenceslas Monument Prague","guide":"Wenzelsdenkmal: Die monumentale Reiterstatue stammt von Josef Václav Myslbek. An der Gesamtgruppe wurde über Jahrzehnte gearbeitet; der heilige Wenzel wird von weiteren böhmischen Landespatronen begleitet. Der Bereich wurde zu einem symbolischen Treffpunkt der tschechischen Geschichte.\n\nNationalmuseum: Der große historistische Bau am oberen Ende des Platzes entstand 1885–1891. Seine Lage ist bewusst monumental: Er bildet den architektonischen Abschluss des gesamten Wenzelsplatzes.\n\nVor Ort beachten: Stellt euch so, dass Denkmal, Museumsfassade und lange Platzachse gemeinsam sichtbar sind.","planned":"18:10–18:20","lat":50.0797,"lon":14.4301,"mapsQuery":"Statue of Saint Wenceslas, Václavské náměstí, 110 00 Praha 1, Czechia"},{"id":"tue3_lucerna","name":"Lucerna-Passage + umgedrehtes Pferd","icon":"🐴","kind":"place","transport":"walk","duration":"ca. 7–9 Min.","action":"Durch die Passage gehen und David Černýs hängendes Pferd anschauen.","note":"Das Werk spielt bewusst mit dem ehrwürdigen Wenzelsdenkmal draußen.","query":"Lucerna Passage Prague David Cerny horse","guide":"Geschichte: Der Palác Lucerna entstand zwischen 1907 und 1920 und wurde wesentlich von Václav Havel gebaut, dem Großvater des späteren Präsidenten Václav Havel. Der Komplex aus Passagen, Sälen, Kino und Geschäften war für seine Zeit hochmodern.\n\nKunst: Unter der Kuppel hängt David Černýs „Kůň“ – der heilige Wenzel sitzt auf einem toten, kopfüber aufgehängten Pferd. Das Werk ist eine ironische Umkehrung des offiziellen Nationaldenkmals, das ihr gerade draußen gesehen habt.\n\nVor Ort beachten: Genau deshalb ist die Reihenfolge Wenzelsdenkmal → Lucerna so gut: Erst das Original, dann die provokante Antwort.","planned":"18:25–18:40","lat":50.0811,"lon":14.424,"mapsQuery":"Lucerna Passage, Vodičkova 36, 110 00 Praha 1, Czechia"},{"id":"tue3_franciscan","name":"Franziskanergarten","icon":"🌹","kind":"place","transport":"walk","duration":"ca. 2–3 Min.","action":"Kurz durch den ruhigen Garten gehen.","note":"Heute bis 22:00 geöffnet.","query":"Franciscan Garden Prague","guide":"Geschichte: Der Garten geht auf den mittelalterlichen Klostergarten zurück, der im Zusammenhang mit der Gründung der Neustadt entstand. Seit dem frühen 17. Jahrhundert wurde er von Franziskanern genutzt, die hier unter anderem Kräuter, Gemüse, Obst und Gewürze anbauten.\n\nUmgebung: Ihr befindet euch mitten zwischen Wenzelsplatz, Jungmannplatz und großen Einkaufsstraßen – trotzdem wirkt der Garten fast abgeschirmt.\n\nVor Ort beachten: Die Rosenbögen, Kräuterbeete und Obstbäume erinnern noch an die frühere Nutzgartenfunktion.","planned":"18:40–18:55","lat":50.082,"lon":14.423,"mapsQuery":"Franciscan Garden, Jungmannovo náměstí, 110 00 Praha 1, Czechia"},{"id":"tue3_oursnow","name":"Kirche Maria Schnee","icon":"⛪","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Wahrscheinlich nur noch außen anschauen; der reguläre touristische Zugang endet früher.","note":"Das unvollendete Kirchenprojekt besitzt trotzdem ein außergewöhnlich hohes Gewölbe und einen sehr hohen Barockaltar.","query":"Church of Our Lady of the Snows Prague","guide":"Geschichte: Die Kirche Maria Schnee wurde im 14. Jahrhundert im Zusammenhang mit der Neustadt und einer Klostergründung begonnen. Der ursprüngliche Plan war wesentlich größer als das, was tatsächlich vollendet wurde. Trotzdem besitzt der heutige Chor ein beeindruckend hohes Gewölbe.\n\nInnen: Der frühbarocke Hauptaltar ist etwa 29 Meter hoch und gilt als höchster Säulenaltar Prags.\n\nUmgebung: Kirche, Franziskanergarten und Jungmannplatz gehören räumlich eng zusammen und bilden einen ruhigen Gegenpol zu den Einkaufsstraßen.","planned":"18:55","lat":50.0822,"lon":14.4219,"mapsQuery":"Church of Our Lady of the Snows, Jungmannovo náměstí 18, 110 00 Praha 1, Czechia"},{"id":"tue3_jungmann","name":"Jungmannplatz","icon":"🏙️","kind":"place","transport":"walk","duration":"1–2 Min.","action":"Nur kurz Atmosphäre mitnehmen und weiter.","note":"Übergang zwischen historischer Neustadt und moderner Einkaufszone.","query":"Jungmann Square Prague","guide":"Geschichte & Umgebung: Der Jungmannplatz ist nach Josef Jungmann benannt, einer Schlüsselfigur der tschechischen nationalen Wiedergeburt und Sprachbewegung. Der Platz liegt an einem wichtigen Übergang zwischen Wenzelsplatz, Národní třída und Altstadt.\n\nVor Ort beachten: Das ist bewusst kein langer Stopp. Nutzt ihn als ruhige Verbindung zum letzten Sightseeing-Punkt.","planned":"19:00","lat":50.0825,"lon":14.4213,"mapsQuery":"Jungmannovo náměstí, 110 00 Praha 1, Czechia"},{"id":"tue3_kafka","name":"Kafka-Drehkopf","icon":"🤯","kind":"place","transport":"walk","duration":"ca. 5 Min.","action":"Kinetische Skulptur anschauen. Wenn ihr kurz vor einer Bewegungsphase ankommt, ein paar Minuten warten.","note":"Fast 11 Meter hoch, aus 42 drehbaren Edelstahlsegmenten; 2014 aufgestellt.","query":"Franz Kafka rotating head Prague","guide":"Geschichte & Kunst: David Černýs kinetische Skulptur „Hlava Franze Kafky“ wurde 2014 aufgestellt. Der monumentale Kopf besteht aus 42 horizontalen Edelstahlsegmenten, die sich unabhängig drehen und das Gesicht immer wieder zerlegen und neu zusammensetzen.\n\nWarum Kafka: Das ständig instabile Gesicht passt sehr direkt zu Themen wie Identität, Entfremdung und Verwandlung, die man mit Franz Kafka verbindet.\n\nUmgebung: Die Skulptur steht beim modernen Quadrio-Komplex – also bewusst nicht in einem historischen Kafka-Haus. Der Kontrast zwischen moderner Technik und literarischer Erinnerung ist Teil der Wirkung.\n\nVor Ort beachten: Die Bewegung läuft nicht dauerhaft. Wenn gerade alles stillsteht, lohnt ein kurzer Moment Geduld.","planned":"19:05–19:20","lat":50.0817,"lon":14.4209,"mapsQuery":"Franz Kafka - Rotating Head, Charvátova, 110 00 Praha 1, Czechia"},{"id":"tue3_finish","name":"Sightseeing fertig – Essen / Kaffee / Hotel","icon":"🍴","kind":"food","transport":"walk","duration":"flexibel","action":"Ab jetzt nichts mehr erzwingen: essen, Kaffee, Shopping oder zurück ins Hotel.","note":"Der feste Dienstag ist hier beendet. Nutzt „Noch Zeit & Lust“, falls ihr spontan weitergehen möchtet.","query":"restaurants near Quadrio Prague","guide":"Tagesfazit: Ihr habt an einem Tag Kleinseite, Karlsbrücke, Klementinum-Höfe, Josefov, Altstädter Ring, Königsweg und einen großen Teil der Neustadt miteinander verbunden.\n\nVor Ort beachten: Jetzt bewusst Schluss mit Pflichtpunkten. Wenn noch Energie da ist, entscheidet spontan – die App soll euch ab hier nicht weiter hetzen.","planned":"ab 19:20","lat":50.0817,"lon":14.4209,"mapsQuery":"Quadrio, Spálená 22, 110 00 Praha 1, Czechia"}]},{"id":"wed","label":"MITTWOCH","date":"2026-09-02","title":"Grébovka + optional Vyšehrad","duration":"ca. 4–6 Std.","wake":"08:30","leave":"09:30","theme":"Entspannter Parktag mit optionalem Extra","stops":[{"id":"wed_cafe","name":"Morgen-Café · IPPA Tylovo náměstí","icon":"☕","kind":"food","transport":"walk","duration":"ca. 5–8 Min. vom Hotel","optional":true,"action":"Optional Kaffee/Frühstück direkt bei I. P. Pavlova; danach von dort Richtung Krymská / Grébovka weiter.","note":"Optional. Liegt am geplanten Weg zur Tram bei I. P. Pavlova. Aktuell mittwochs 08:00–20:00 gelistet.","query":"IPPA Café Tylovo Náměstí, Tylovo Nám. 2, Prague","guide":"Der Café-Stopp liegt direkt an eurem geplanten ÖPNV-Einstieg für Grébovka."},{"id":"wed_ticket_out","name":"Hotel → Grébovka","icon":"🔔","kind":"ticket","transport":"transit","duration":"ca. 15–25 Min.","action":"4 × 30-Minuten-Ticket aktivieren, 60 Sekunden warten.","note":"Aktueller Plan: zu I. P. Pavlova, Tram 22 Richtung Nádraží Hostivař bis Krymská. Live prüfen.","ticket":"30m","query":"Krymská Prague","lat":50.0711,"lon":14.4493,"guide":"Heute nutzt ihr nur kurze ÖPNV-Etappen; deshalb ist das 30-Minuten-Ticket vorgesehen."},{"id":"wed_grebovka","name":"Grébovka / Havlíčkovy sady","icon":"➡️","kind":"place","transport":"walk","duration":"ab Krymská wenige Minuten","action":"In den Park gehen.","note":"Grotta ist der erste feste Programmpunkt.","query":"Havlíčkovy sady Prague","lat":50.0695,"lon":14.4444,"wiki":"Havlíčkovy sady","guide":"Geschichte: Havlíčkovy sady, meist Grébovka genannt, entstand im 19. Jahrhundert als private Gartenanlage des Industriellen Moritz Gröbe. Die Gestaltung orientierte sich an italienischer Renaissance und romantischer Landschaftsarchitektur. Zum Ensemble gehörten Villa, Weinberg, Pavillons, Grotta, Wasseranlagen und Aussichtspunkte. Anfang des 20. Jahrhunderts wurde das Gelände von der damaligen Stadt Královské Vinohrady übernommen und als öffentlicher Park zugänglich gemacht.\n\nUmgebung: Der Park liegt an einem Hang oberhalb des Botič-Tals. Dadurch wechseln Weinberg, Terrassen, bewaldete Bereiche und offene Aussicht schnell miteinander.\n\nVor Ort beachten: Versucht den Park nicht nur als Grünfläche zu sehen, sondern als bewusst komponierte historische Landschaft. Eure nächsten Halte – Grotta, Kaskade und Aussicht – sind Teile dieses Gesamtkonzepts."},{"id":"wed_grotta","name":"Grotta","icon":"❤️","kind":"place","transport":"walk","duration":"5–10 Min. im Park","action":"Künstliche Felsen- und Höhlenanlage anschauen.","note":"Gewünschter Programmpunkt – nicht streichen.","query":"Grotta Havlíčkovy sady Prague","lat":50.0689,"lon":14.4457,"wiki":"Havlíčkovy sady","guide":"Geschichte: Die künstliche Grotta der Grébovka gehört zur romantischen Gartengestaltung des 19. Jahrhunderts. Solche künstlichen Felsen, Höhlen und Ruinen waren in europäischen Landschaftsgärten beliebt, weil sie Natur dramatischer und geheimnisvoller wirken lassen sollten. Die Prager Anlage wurde aus künstlich modelliertem Material aufgebaut und später umfassend restauriert.\n\nUmgebung: Die Grotta liegt eingebettet in Vegetation und Wasseranlagen. Dadurch entsteht bewusst der Eindruck, man befinde sich plötzlich nicht mehr mitten in einer Großstadt.\n\nVor Ort beachten: Lauft nicht nur außen vorbei. Schaut in Nischen, Bögen und auf die unregelmäßigen Felsoberflächen. Der Reiz liegt darin, dass alles „natürlich“ aussieht, obwohl fast die gesamte Szenerie geplant und künstlich geschaffen wurde."},{"id":"wed_cascade","name":"Wasserkaskade + kleiner See","icon":"➡️","kind":"place","transport":"walk","duration":"5–8 Min.","action":"Kurz anschauen.","note":"Teil des entspannten Parkspaziergangs.","query":"Havlíčkovy sady lake Prague","lat":50.0692,"lon":14.4449,"wiki":"Havlíčkovy sady","guide":"Geschichte: Wasserkaskaden, Teiche und künstliche Felsen waren Teil der aufwendig komponierten Gartenanlage von Grébovka. Wasser sollte Bewegung, Spiegelungen und Geräusche in den Park bringen und die romantische Wirkung der Grotta verstärken. Viele Elemente wurden im Laufe des 20. Jahrhunderts beschädigt oder vernachlässigt und später restauriert.\n\nUmgebung: Hier befindet ihr euch im stärker landschaftlich gestalteten Teil des Parks. Wege, Felsen, Wasser und Pflanzen sind so kombiniert, dass immer neue kleine Blickachsen entstehen.\n\nVor Ort beachten: Es ist ein kurzer Halt. Schaut darauf, wie die Kaskade mit der Grotta und dem kleinen See zusammenarbeitet – einzeln sind es kleine Elemente, gemeinsam bilden sie eine inszenierte Landschaft."},{"id":"wed_view","name":"Grébovka-Aussicht / oberer Parkbereich","icon":"➡️","kind":"place","transport":"walk","duration":"5–10 Min.","action":"Aussicht genießen und kurz im Park bleiben.","note":"Kein Zeitdruck.","query":"Grébovka viewpoint Prague","lat":50.07,"lon":14.4438,"wiki":"Havlíčkovy sady","guide":"Geschichte: Die Aussichtspunkte der Grébovka hängen mit der ursprünglichen Anlage als repräsentativer Privatpark zusammen. Die Hanglage wurde bewusst genutzt, um freie Blicke über Vinohrady und andere Teile Prags zu schaffen. Auch Weinbau gehörte historisch zum Gelände und knüpft an die ältere Weinbergstradition der Gegend an.\n\nUmgebung: Von oben versteht ihr die Topografie des Viertels besser: Grébovka fällt zum Botič-Tal ab, während Vinohrady auf den höheren Flächen liegt.\n\nVor Ort beachten: Nutzt den Halt zum Durchatmen. Schaut nicht nur auf einzelne Sehenswürdigkeiten, sondern auf die Stadtstruktur – Dächer, Kirchtürme, Wohnblöcke und Grünflächen zeigen Prag außerhalb des touristischen Altstadtzentrums."},{"id":"wed_vinohrady","name":"Vinohrady / Umgebung","icon":"➡️","kind":"place","transport":"walk","duration":"10–20 Min. gemütlich","action":"Einfach etwas durch das Viertel laufen.","note":"Kein eigener langer Programmpunkt.","query":"Vinohrady Prague","lat":50.075,"lon":14.443,"wiki":"Vinohrady","guide":"Geschichte: Der Name Vinohrady bedeutet „Weinberge“. Tatsächlich wurden die Hänge östlich und südöstlich der Prager Altstadt seit dem Mittelalter für Weinbau genutzt. Im 19. Jahrhundert wuchs hier eine eigenständige Stadt mit repräsentativen Mietshäusern, breiten Straßen und Plätzen. 1922 wurde Vinohrady Teil von Groß-Prag.\n\nUmgebung: Das Viertel fühlt sich deutlich weniger touristisch an als Altstadt und Kleinseite. Typisch sind reich dekorierte Häuser aus dem späten 19. und frühen 20. Jahrhundert, Cafés, lokale Geschäfte und baumbestandene Straßen.\n\nVor Ort beachten: Hier gibt es keinen einzelnen „Pflichtbau“. Der Programmpunkt ist das Viertel selbst. Schaut auf Hauseingänge, Erker, Balkone und Fassaden – so bekommt ihr ein Gefühl für das bürgerliche Prag jenseits der
